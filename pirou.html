weight:4,size:"8-12 cm",guidance:"Source peche.com : en pr\xE9sence de sprats d'une dizaine de centim\xE8tres, shads de 10 cm plomb\xE9s de 12 \xE0 25 g selon profondeur et courant."},{name:"Sardine",couche:"mi-eau",months:[6,7,8,9,10],weight:4,size:"15-20 cm",guidance:"Source peche.com : en pr\xE9sence de sardines, monter en taille \u2014 Black Minnow 140 sur t\xEAte de 20 g en lin\xE9aire. Les oiseaux restent le meilleur indicateur de chasse."},{name:"Alevins de mulet",couche:"surface",months:[6,7,8,9],weight:3,size:"3-8 cm",guidance:"Bancs en surface dans les havres et sur les bordures. Petit stickbait ou souple weightless en bordure de banc."},{name:"Crabe mou (p\xE9riode de mue)",couche:"fond",months:[5,6,7,8,9],weight:3,size:"3-6 cm",guidance:"Sur les platiers rocheux de Portbail, Carteret et la Hague. Souple compact, animation tr\xE8s lente au ras du fond."}],tide:{defaultPort:"pirou",ports:{granville:{label:"Granville",kind:"secondary",ref:"sthelier",lagH:2.22,hw:{t:[-8.2092,-.14058],h:[7.1749,1.13991]},lw:{t:[-6.6482,3.05752],h:[6.976,1.15325]},accuracy:"SHOM \xB14,4 min \xB7 \xB19 cm (mois de contr\xF4le)"},portbail:{label:"Portbail",kind:"secondary",ref:"dielette",lagH:2.49,hw:{t:[-27.7814,1.79479],h:[6.4078,1.17358]},lw:{t:[-26.297,3.88113],h:[6.0932,1.10946]},accuracy:"SHOM \xB15,1 min \xB7 \xB18 cm (mois de contr\xF4le)"},dielette:{label:"Di\xE9lette",kind:"secondary",ref:"dielette",lagH:2.75,hw:{t:[-2.8473,.28362],h:[5.474,1.00639]},lw:{t:[-2.5548,.63108],h:[5.3563,.98401]},accuracy:"SHOM \xB14,5 min \xB7 \xB16 cm (mois de contr\xF4le)"},goury:{label:"Goury",kind:"secondary",ref:"dielette",lagH:3.07,hw:{t:[7.2185,1.79474],h:[5.3078,.66158]},lw:{t:[-6.6344,1.79186],h:[5.2246,.91397]},accuracy:"SHOM \xB16,3 min \xB7 \xB16 cm (mois de contr\xF4le)"},pirou:{label:"Pirou (interpol\xE9)",kind:"interp",a:"granville",b:"portbail",w:.664,accuracy:"Interpol\xE9 Granville/Portbail \u2014 heures \xB16 min en moyenne, hauteurs approximatives (\xB10,5 m)"},regneville:{label:"R\xE9gn\xE9ville (interpol\xE9)",kind:"interp",a:"granville",b:"portbail",w:.364,accuracy:"Interpol\xE9 Granville/Portbail \u2014 heures \xB16 min en moyenne, hauteurs approximatives (\xB10,5 m)"},agon:{label:"Agon (interpol\xE9)",kind:"interp",a:"granville",b:"portbail",w:.364,accuracy:"Interpol\xE9 Granville/Portbail \u2014 heures \xB16 min en moyenne, hauteurs approximatives (\xB10,5 m)"},gouville:{label:"Gouville (interpol\xE9)",kind:"interp",a:"granville",b:"portbail",w:.496,accuracy:"Interpol\xE9 Granville/Portbail \u2014 heures \xB16 min en moyenne, hauteurs approximatives (\xB10,5 m)"},carteret:{label:"Carteret (interpol\xE9)",kind:"interp",a:"portbail",b:"dielette",w:.147,accuracy:"Interpol\xE9 Portbail/Dielette \u2014 heures \xB16 min en moyenne, hauteurs approximatives (\xB10,5 m)"},surtainville:{label:"Surtainville (interpol\xE9)",kind:"interp",a:"portbail",b:"dielette",w:.528,accuracy:"Interpol\xE9 Portbail/Dielette \u2014 heures \xB16 min en moyenne, hauteurs approximatives (\xB10,5 m)"},sciotot:{label:"Sciotot (interpol\xE9)",kind:"interp",a:"portbail",b:"dielette",w:.835,accuracy:"Interpol\xE9 Portbail/Dielette \u2014 heures \xB16 min en moyenne, hauteurs approximatives (\xB10,5 m)"}}},sstTypical:[8.2,17.8]},$s={title:"Principes g\xE9n\xE9raux \u2014 p\xEAche du bar du bord en Cotentin ouest",items:[{rule:"Coefficient 70-90 : la fen\xEAtre de r\xE9f\xE9rence du Cotentin",source:"despoissonssigrands.com (carnets de p\xEAche Cotentin)",explain:"Au-del\xE0 de 90, le courant devient si fort que certains spots du nord de la c\xF4te sont quasiment impossibles \xE0 p\xEAcher, avec des vitesses de d\xE9rive sup\xE9rieures \xE0 6 n\u0153uds. En dessous de 60, l'estran ne se d\xE9couvre pas assez pour lire les structures. C'est l'inverse exact de la rade de Brest, o\xF9 les coefficients mod\xE9r\xE9s dominent."},{rule:"Sur les spots \xE0 courant violent, p\xEAcher la fin de descendante et le d\xE9but de montante",source:"peche.com \u2014 P\xEAche du bar du bord dans le Cotentin",explain:"Au plus fort du courant il est compliqu\xE9 de p\xEAcher correctement. La fen\xEAtre utile va jusqu'\xE0 2h-2h30 apr\xE8s le basculement : \xE0 ce moment le flot vient recouvrir l'estran et les bars le suivent. C'est la r\xE8gle structurante de toute la c\xF4te, et elle prime sur les pr\xE9f\xE9rences de spot."},{rule:"Le flot qui recouvre l'estran est le moteur de la c\xF4te des havres",source:"peche.com / cpiecotentin.com",explain:"De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses entrecoup\xE9es de quatre havres, qui d\xE9couvrent \xE0 mar\xE9e basse sur des estrans rocheux. Le marnage \xE9norme met \xE0 nu des kilom\xE8tres d'estran ; les bars entrent avec les premiers centim\xE8tres d'eau pour exploiter ce garde-manger remis en suspension."},{rule:"Prospecter tr\xE8s peu profond sur les bancs de sable au montant",source:"Guide p\xEAche Latitude Manche (Conseil d\xE9partemental de la Manche)",explain:"Sur les bancs de la pointe de sable d'Agon, \xE0 mar\xE9e montante, on recherche les bars pr\xE9sents dans 50 cm d'eau, aux leurres plongeants type long bill minnow ou au buldo. Corollaire de s\xE9curit\xE9 explicite dans la m\xEAme source : attention \xE0 ne pas se laisser entourer par la mar\xE9e."},{rule:"Adapter la taille du leurre \xE0 la proie du moment",source:"peche.com \u2014 sorties Cotentin",explain:"En pr\xE9sence de sprats d'une dizaine de centim\xE8tres, des shads de 10 cm plomb\xE9s de 12 \xE0 25 g selon profondeur et courant. En pr\xE9sence de sardines, monter en taille. Par fort ensoleillement, les leurres \xE0 paillettes sortent clairement du lot. Les oiseaux restent le meilleur indicateur de chasse."},{rule:"Mat\xE9riel : longueur de canne pour lancer loin des leurres l\xE9gers",source:"peche.com \u2014 P\xEAche du bar du bord dans le Cotentin",explain:"Cannes de 2,30 m \xE0 2,40 m, puissances de 5/15 g \xE0 10/30 g. La contrainte dominante du bord en Cotentin est la capacit\xE9 \xE0 lancer loin des leurres relativement l\xE9gers, sur des estrans plats o\xF9 le poisson peut \xEAtre \xE0 distance."}]},Oe=[{id:"pirou",tidePort:"pirou",isLocal:!0,zone:"local",dangerLevel:1,name:"Pirou Plage",subtitle:"Estran, \xE9pis et tables, Pirou",distance:"sur place",distMin:0,coords:"49\xB010'N 1\xB035'W",type:"ESTRAN SABLEUX + TABLES",color:"#22c55e",terrain:{fond:"Sable dominant sur l'estran ; tables ostr\xE9icoles et bouchots en secteurs.",encombrement:2,gratter:"oui",couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte plomb\xE9e l\xE9g\xE8re sur le sable ; weightless au-dessus des tables, o\xF9 un plomb\xE9 accroche.",conseils:["Sur le sable, p\xEAcher pr\xE8s du fond dans les 40 \xE0 80 premiers centim\xE8tres d'eau du flot.","Aux tables, passer au-dessus des structures, jamais entre les pieds."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"\xAB De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses, entrecoup\xE9es par quatre havres. \xBB",s:"CPIE du Cotentin \u2014 o\xF9 p\xEAcher"},{t:"Des p\xEAcheurs locaux p\xEAchent le bar au leurre souple sur les bouchots et les tables \xE0 hu\xEEtres de Pirou plage.",s:"Forum P\xEAche en mer Cotentin \u2014 \xAB p\xEAche au bar \xBB"}]},coefBand:[35,60,95,115],coefMin:60,coefIdeal:95,coefMax:115,houleMax:2,exposedAngles:[247.5,270,292.5],shelteredAngles:[67.5,90,112.5],weatherNote:"Plein ouest, aucune protection. Le vent d'O/SO monte directement sur l'estran ; le vent d'E aplatit et clarifie.",sources:["pechemercotentin.forumactif.org \u2014 sujet \xAB p\xEAche au bar \xBB","cpiecotentin.com \u2014 'De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses, entrecoup\xE9es par quatre havres, qui d\xE9couvrent \xE0 mar\xE9e basse sur des estrans rocheux'","pechemercotentin.forumactif.org \u2014 p\xEAcheurs locaux au leurre souple sur Pirou plage, travaillant les bouchots et tables \xE0 hu\xEEtres, bons poissons en avril","peche.com \u2014 P\xEAche du bar du bord dans le Cotentin (technique g\xE9n\xE9rale du flot sur estran)"],topology:{fond:{text:"Sable dominant, estran tr\xE8s plat d\xE9couvrant loin, secteurs de tables ostr\xE9icoles et bouchots. Fosses de retour parall\xE8les au rivage creus\xE9es par la houle.",confidence:"verified"},structure:{text:"Les tables et bouchots forment un r\xE9cif artificiel : abri, biomasse fix\xE9e, ralentissement du courant. Les p\xEAcheurs locaux du secteur les citent explicitement comme zone de travail au leurre souple.",confidence:"verified"},exposition:{text:"Face plein ouest, fetch de plus de 100 km. Rien ne casse la houle d'O/NO. Le vent d'est terrestre aplatit la mer et \xE9claircit l'eau.",confidence:"local_knowledge"},courant:{text:"Courant de mar\xE9e parall\xE8le \xE0 la c\xF4te, mod\xE9r\xE9 sur l'estran ouvert, acc\xE9l\xE9r\xE9 dans les fosses de retour et entre les rang\xE9es de tables.",confidence:"inference"},bars:{text:"Bars de bordure entrant avec le flot pour exploiter vers, coques et crevettes remis en suspension. Poissons souvent calibr\xE9s, chasses possibles en fin de journ\xE9e. Prises document\xE9es au printemps par les p\xEAcheurs du secteur.",confidence:"verified"}},tidalRules:{typeHeure:"MONTANT SUR ESTRAN + CR\xC9PUSCULES",montantOuDescendant:"Montant nettement dominant : c'est le flot recouvrant l'estran qui d\xE9clenche l'entr\xE9e des bars. Le descendant fonctionne surtout dans les fosses de retour, quand l'eau se vidange.",description:"Spot de base, accessible en permanence. On p\xEAche le flot qui remonte l'estran, en avan\xE7ant avec lui, et on travaille les tables d\xE8s qu'elles sont recouvertes de 40 \xE0 80 cm d'eau.",windows:[{id:"pi1",label:"Mi-montant \u2192 PM-1h",phase:"pm",offsetBefore:-3.5,offsetAfter:-1,tidePhaseType:"montant",priority:"prime",note:"Le flot recouvre l'estran et les tables. Suivre l'eau qui monte, lancer devant soi dans 40-80 cm. Shad 10 cm plomb\xE9 l\xE9ger ou souple weightless."},{id:"pi2",label:"D\xE9but de montant sur BM",phase:"bm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"montant",priority:"prime",note:"Les tout premiers centim\xE8tres d'eau sur l'estran d\xE9couvert. Bars tr\xE8s peu profonds, souvent \xE0 moins de 20 m du bord. Approche discr\xE8te obligatoire."},{id:"pi3",label:"Descendant dans les fosses",phase:"pm",offsetBefore:1.5,offsetAfter:3.5,tidePhaseType:"descendant",priority:"bon",note:"L'eau se vidange par les fosses de retour et y concentre les proies. Prospecter parall\xE8lement au rivage, pas perpendiculairement."}],lifeHack:"Rep\xE9rer les fosses et les ba\xEFnes \xE0 basse mer par grand coefficient : ce sont les veines que les bars empruntent au flot. Une photo a\xE9rienne \xE0 BM vaut dix sessions \xE0 l'aveugle."},lures:[{name:"Shad souple 10-12 cm t\xEAte plomb\xE9e l\xE9g\xE8re",color:"Ayu / naturel / paillettes par grand soleil",weight:"7-14 g",technique:"Lin\xE9aire lent dans 40-80 cm d'eau sur l'estran recouvert. Adapter \xE0 la proie : shad 10 cm sur sprats, plus grand si sardines."},{name:"Souple weightless sur les tables",color:"Naturel / blanc",weight:"7-10 g mont\xE9 sans plomb",technique:"Passage \xE0 fleur d'eau au-dessus des structures, l\xE0 o\xF9 un leurre plomb\xE9 accrocherait. Le co\xFBt faible autorise les zones encombr\xE9es."},{name:"Stickbait 110-140 mm",color:"Ghost / Iwashi / blanc en basse lumi\xE8re",weight:"14-25 g",technique:"Walking the dog au cr\xE9puscule sur le flot, le long des \xE9pis. Patchinko 125 ou Asturie 110 en r\xE9f\xE9rence perso."}],access:"Acc\xE8s direct depuis Pirou Plage, parkings en front de mer. Aucune difficult\xE9."},{id:"regneville",tidePort:"regneville",isLocal:!0,zone:"local",dangerLevel:2,name:"R\xE9gn\xE9ville",subtitle:"Havre et embouchure de la Sienne",distance:"15 min",distMin:15,coords:"49\xB001'N 1\xB034'W",type:"EMBOUCHURE / HAVRE",color:"#4ade80",terrain:{fond:"Sable et sablo-vase, chenal de vidange marqu\xE9 ; roche affleurante par endroits \xE0 basse mer.",encombrement:1,gratter:"oui",couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte plomb\xE9e r\xE9gl\xE9e sur le courant du chenal ; texan sur les bancs (r\xE9f\xE9rence Black Minnow).",conseils:["Ne jamais traverser le havre \xE0 pied seul : la travers\xE9e se fait \xE0 mar\xE9e basse et accompagn\xE9e (Attitude Manche).","Le plombage se r\xE8gle sur la vitesse du courant, pas sur la profondeur."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"Le havre de la Sienne se traverse \xE0 pied \xE0 mar\xE9e basse seulement, accompagn\xE9 : \xAB trop dangereux seul \xBB. Il est s\xE9par\xE9 de la mer par l'espace naturel class\xE9 de la pointe d'Agon.",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"}]},coefBand:[35,60,95,115],coefMin:60,coefIdeal:95,coefMax:115,houleMax:1.5,exposedAngles:[247.5,270],shelteredAngles:[45,67.5,90,112.5],weatherNote:"Havre partiellement abrit\xE9 par le cordon dunaire. Reste ouvert au secteur ouest \xE0 pleine mer.",sources:["cirkwi.com \u2014 Le havre de Sienne (Attitude Manche)","sylco-peche-brehal.fr \u2014 'La Sienne est une tr\xE8s belle rivi\xE8re' ; le secteur est pr\xE9sent\xE9 comme zone de p\xEAche du bord reconnue de la c\xF4te des havres","cpiecotentin.com \u2014 g\xE9omorphologie de la c\xF4te des havres, estrans rocheux d\xE9couvrant \xE0 mar\xE9e basse","peche.com \u2014 principe g\xE9n\xE9ral des embouchures et du flot sur estran"],topology:{fond:{text:"Sable et sablo-vase, chenal de vidange bien marqu\xE9, bancs mobiles de part et d'autre. L'estran rocheux affleure par endroits \xE0 basse mer.",confidence:"verified"},structure:{text:"Embouchure de la Sienne : le havre stocke une masse d'eau consid\xE9rable \xE0 chaque mar\xE9e et la restitue par un chenal \xE9troit. Configuration d'entonnoir, la plus lisible du secteur.",confidence:"local_knowledge"},exposition:{text:"Le cordon dunaire casse la houle d'ouest sur la partie interne. La sortie de chenal reste expos\xE9e par vent d'O soutenu.",confidence:"local_knowledge"},courant:{text:"Tr\xE8s fort dans le chenal en vive-eau, bien plus que sur l'estran ouvert. C'est le moteur du spot et sa principale contrainte.",confidence:"inference"},bars:{text:"Poste d'interception classique : le bar se cale en sortie de chenal et filtre le flux sortant charg\xE9 de proies. Gradient de salinit\xE9 attractif. Le secteur est cit\xE9 comme zone de p\xEAche appr\xE9ci\xE9e des locaux.",confidence:"verified"}},tidalRules:{typeHeure:"DESCENDANT \xC9TABLI",montantOuDescendant:"Descendant nettement dominant : c'est la vidange du havre qui concentre la nourriture. Le montant fonctionne en fin de flot, quand les bars remontent dans le havre.",description:"Le spot le plus r\xE9gulier du secteur sur la mar\xE9e descendante. On p\xEAche la veine du chenal en d\xE9rive, contact permanent avec le leurre.",windows:[{id:"re1",label:"PM+1h \u2192 PM+4h30 (jusant)",phase:"pm",offsetBefore:1,offsetAfter:4.5,tidePhaseType:"descendant",priority:"prime",note:"Vidange pleine du havre. Lancer en amont, laisser d\xE9river le souple dans la veine. Adapter le plombage \xE0 la vitesse : 12 \xE0 25 g."},{id:"re2",label:"Fin de montant",phase:"pm",offsetBefore:-2.5,offsetAfter:-.5,tidePhaseType:"montant",priority:"bon",note:"Les bars remontent dans le havre avec le flot. Prospection plus large, plus lente, moins de courant."},{id:"re3",label:"\xC9tale de BM + reprise",phase:"bm",offsetBefore:-.5,offsetAfter:1.5,tidePhaseType:"montant",priority:"bon",note:"Fen\xEAtre calme o\xF9 le chenal est le seul endroit avec de l'eau. Concentration m\xE9canique du poisson."}],lifeHack:"Ne jamais traverser le chenal, m\xEAme \xE0 basse mer apparente : les bancs sont mobiles et le flot reprend par l'arri\xE8re. Rep\xE9rer un point de repli visible avant de commencer."},lures:[{name:"Shad souple t\xEAte plomb\xE9e lourde",color:"Naturel / blanc en eau teint\xE9e",weight:"12-25 g selon courant",technique:"D\xE9rive
