ville",b:"portbail",w:.496,accuracy:"Interpol\xE9 Granville/Portbail, non contr\xF4l\xE9 sur place. M\xEAme m\xE9thode qu'\xE0 Pirou, o\xF9 l'\xE9cart mesur\xE9 est : pleines mers \xB112 min si coef \u2265 60, jusqu'\xE0 \xB140 min en morte-eau ; basses mers jusqu'\xE0 \xB160 min ; hauteurs \xB10,2 \xE0 0,3 m"},carteret:{label:"Carteret (interpol\xE9)",kind:"interp",a:"portbail",b:"dielette",w:.147,accuracy:"Interpol\xE9 Portbail/Di\xE9lette, non contr\xF4l\xE9 sur place. M\xEAme m\xE9thode qu'\xE0 Pirou, o\xF9 l'\xE9cart mesur\xE9 est : pleines mers \xB112 min si coef \u2265 60, jusqu'\xE0 \xB140 min en morte-eau ; basses mers jusqu'\xE0 \xB160 min ; hauteurs \xB10,2 \xE0 0,3 m"},surtainville:{label:"Surtainville (interpol\xE9)",kind:"interp",a:"portbail",b:"dielette",w:.528,accuracy:"Interpol\xE9 Portbail/Di\xE9lette, non contr\xF4l\xE9 sur place. M\xEAme m\xE9thode qu'\xE0 Pirou, o\xF9 l'\xE9cart mesur\xE9 est : pleines mers \xB112 min si coef \u2265 60, jusqu'\xE0 \xB140 min en morte-eau ; basses mers jusqu'\xE0 \xB160 min ; hauteurs \xB10,2 \xE0 0,3 m"},sciotot:{label:"Sciotot (interpol\xE9)",kind:"interp",a:"portbail",b:"dielette",w:.835,accuracy:"Interpol\xE9 Portbail/Di\xE9lette, non contr\xF4l\xE9 sur place. M\xEAme m\xE9thode qu'\xE0 Pirou, o\xF9 l'\xE9cart mesur\xE9 est : pleines mers \xB112 min si coef \u2265 60, jusqu'\xE0 \xB140 min en morte-eau ; basses mers jusqu'\xE0 \xB160 min ; hauteurs \xB10,2 \xE0 0,3 m"}}},sstTypical:[8.2,17.8]},Rf={title:"Principes g\xE9n\xE9raux \u2014 p\xEAche du bar du bord en Cotentin ouest",items:[{rule:"Coefficient 70-90 : la pr\xE9f\xE9rence d'un p\xEAcheur du Cotentin",source:"despoissonssigrands.com \u2014 \xAB P\xEAche du bar en automne : retour sur une excellente sortie dans le Cotentin \xBB (r\xE9cit d'une sortie en bateau)",explain:"\xAB J'appr\xE9cie un coefficient de mar\xE9e entre 70 et 90. \xBB Au-dessus, \xAB le courant est tr\xE8s fort \xBB : en bateau, \xAB certains spots du nord de la c\xF4te sont quasiment impossibles \xE0 p\xEAcher \xBB, la d\xE9rive d\xE9passant 6 n\u0153uds. C'est une pr\xE9f\xE9rence personnelle, tir\xE9e d'une sortie en bateau ; faute de source propre \xE0 chaque spot du bord, le guide s'en sert comme plage de r\xE9f\xE9rence."},{rule:"Cap de la Hague : la fin de la descendante et le d\xE9but de la remontante",source:"peche.com \u2014 B. Le Provost, \xAB P\xEAche du bar du bord dans le Cotentin : comment r\xE9ussir son ouverture depuis la c\xF4te \xBB (23/03/2026)",explain:"L'auteur, pour le cap de la Hague : au plus fort du courant il est compliqu\xE9 de p\xEAcher correctement ; il pr\xE9f\xE8re \xAB la fin de la descendante et le d\xE9but de la remontante, jusqu'\xE0 2 h \xE0 2 h 30 apr\xE8s le basculement \xBB. C'est sa pratique dans cette zone ; le guide la reprend par d\xE9duction \xE0 Carteret, Granville et Sciotot."},{rule:"Le flot qui recouvre l'estran est le moteur de la c\xF4te des havres",source:"cpiecotentin.com \xB7 d\xE9duction du guide",explain:"\xAB De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses, entrecoup\xE9es par quatre havres \xBB (CPIE). Le marnage met \xE0 nu des kilom\xE8tres d'estran ; que les bars entrent avec les premiers centim\xE8tres d'eau pour ce garde-manger est une d\xE9duction du guide, que ton journal confirmera ou non."},{rule:"Prospecter tr\xE8s peu profond sur les bancs de sable au montant",source:"Guide p\xEAche Latitude Manche (Conseil d\xE9partemental de la Manche)",explain:"Sur les bancs de la pointe de sable d'Agon, \xE0 mar\xE9e montante, on recherche les bars pr\xE9sents dans 50 cm d'eau, aux leurres plongeants type long bill minnow ou au buldo. Corollaire de s\xE9curit\xE9 explicite dans la m\xEAme source : attention \xE0 ne pas se laisser entourer par la mar\xE9e."},{rule:"Adapter la taille du leurre \xE0 la proie du moment",source:"peche.com \u2014 sorties Cotentin",explain:"En pr\xE9sence de sprats d'une dizaine de centim\xE8tres, des shads de 10 cm plomb\xE9s de 12 \xE0 25 g selon profondeur et courant. En pr\xE9sence de sardines, monter en taille. Les oiseaux restent le meilleur indicateur de chasse."},{rule:"Mat\xE9riel : longueur de canne pour lancer loin des leurres l\xE9gers",source:"peche.com \u2014 P\xEAche du bar du bord dans le Cotentin",explain:"Cannes de 2,30 m \xE0 2,40 m, puissances de 5/15 g \xE0 10/30 g (peche.com, pour la Hague rocheuse). Sur les estrans plats, pouvoir lancer loin des leurres l\xE9gers est une d\xE9duction du guide."}]},Ce=[{id:"pirou",tidePort:"pirou",isLocal:!0,zone:"local",dangerLevel:2,name:"Pirou Plage",subtitle:"Estran, \xE9pis et tables, Pirou",distance:"sur place",distMin:0,coords:"49\xB010'N 1\xB035'W",type:"ESTRAN SABLEUX + TABLES",color:"#22c55e",terrain:{fond:"Sable dominant sur l'estran ; tables ostr\xE9icoles et bouchots en secteurs.",encombrement:2,gratter:"oui",prof:{cls:"estran",why:"Estran tr\xE8s plat qui d\xE9couvre loin (fiche)."},couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte plomb\xE9e l\xE9g\xE8re sur le sable ; weightless au-dessus des tables, o\xF9 un plomb\xE9 accroche.",conseils:["Sur le sable, p\xEAcher pr\xE8s du fond dans les 40 \xE0 80 premiers centim\xE8tres d'eau du flot.","Aux tables, passer au-dessus des structures, jamais entre les pieds.","Spot de ton guide d'origine : une seule source parle du bar ici (forum P\xEAche en mer Cotentin, non rev\xE9rifiable le 29/10/2026) ; ton journal fera foi."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"\xAB De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses, entrecoup\xE9es par quatre havres. \xBB",s:"CPIE du Cotentin \u2014 o\xF9 p\xEAcher"},{t:"Des p\xEAcheurs locaux p\xEAchent le bar au leurre souple sur les bouchots et les tables \xE0 hu\xEEtres de Pirou plage.",s:"Forum P\xEAche en mer Cotentin \u2014 \xAB p\xEAche au bar \xBB"}]},coefBand:[50,70,90,110],houleMax:2,exposedAngles:[247.5,270,292.5],shelteredAngles:[67.5,90,112.5],weatherNote:"Plein ouest, aucune protection. Le vent d'O/SO monte directement sur l'estran ; le vent d'E aplatit et clarifie.",sources:["pechemercotentin.forumactif.org \u2014 sujet \xAB p\xEAche au bar \xBB","cpiecotentin.com \u2014 'De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses, entrecoup\xE9es par quatre havres, qui d\xE9couvrent \xE0 mar\xE9e basse sur des estrans rocheux'","pechemercotentin.forumactif.org \u2014 p\xEAcheurs locaux au leurre souple sur Pirou plage, travaillant les bouchots et tables \xE0 hu\xEEtres, bons poissons en avril","peche.com \u2014 P\xEAche du bar du bord dans le Cotentin (technique g\xE9n\xE9rale du flot sur estran)"],topology:{fond:{text:"Sable dominant, estran tr\xE8s plat d\xE9couvrant loin, secteurs de tables ostr\xE9icoles et bouchots. Fosses de retour parall\xE8les au rivage creus\xE9es par la houle.",confidence:"verified"},structure:{text:"Les tables et bouchots forment un r\xE9cif artificiel : abri, biomasse fix\xE9e, ralentissement du courant. Les p\xEAcheurs locaux du secteur les citent explicitement comme zone de travail au leurre souple.",confidence:"verified"},exposition:{text:"Face plein ouest, fetch de plus de 100 km. Rien ne casse la houle d'O/NO. Le vent d'est terrestre aplatit la mer et \xE9claircit l'eau.",confidence:"local_knowledge"},courant:{text:"Courant de mar\xE9e parall\xE8le \xE0 la c\xF4te, mod\xE9r\xE9 sur l'estran ouvert, acc\xE9l\xE9r\xE9 dans les fosses de retour et entre les rang\xE9es de tables.",confidence:"inference"},bars:{text:"Bars de bordure entrant avec le flot pour exploiter vers, coques et crevettes remis en suspension. Poissons souvent calibr\xE9s, chasses possibles en fin de journ\xE9e. Prises document\xE9es au printemps par les p\xEAcheurs du secteur.",confidence:"verified"}},tidalRules:{typeHeure:"MONTANT SUR ESTRAN + CR\xC9PUSCULES",montantOuDescendant:"Montant nettement dominant : c'est le flot recouvrant l'estran qui d\xE9clenche l'entr\xE9e des bars. Le descendant fonctionne surtout dans les fosses de retour, quand l'eau se vidange.",description:"Spot de base, accessible en permanence. On p\xEAche le flot qui remonte l'estran, en avan\xE7ant avec lui, et on travaille les tables d\xE8s qu'elles sont recouvertes de 40 \xE0 80 cm d'eau.",windows:[{id:"pi1",label:"Mi-montant \u2192 PM-1h",phase:"pm",offsetBefore:-3.5,offsetAfter:-1,tidePhaseType:"montant",priority:"prime",note:"Le flot recouvre l'estran et les tables. Suivre l'eau qui monte, lancer devant soi dans 40-80 cm. Shad 10 cm plomb\xE9 l\xE9ger ou souple weightless."},{id:"pi2",label:"D\xE9but de montant sur BM",phase:"bm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"montant",priority:"prime",note:"Les tout premiers centim\xE8tres d'eau sur l'estran d\xE9couvert. Bars tr\xE8s peu profonds, souvent \xE0 moins de 20 m du bord. Approche discr\xE8te obligatoire."},{id:"pi3",label:"Descendant dans les fosses",phase:"pm",offsetBefore:1.5,offsetAfter:3.5,tidePhaseType:"descendant",priority:"bon",note:"L'eau se vidange par les fosses de retour et y concentre les proies. Prospecter parall\xE8lement au rivage, pas perpendiculairement."}],lifeHack:"Rep\xE9rer les fosses et les ba\xEFnes \xE0 basse mer par grand coefficient : ce sont les veines que les bars empruntent au flot. Une photo a\xE9rienne \xE0 BM vaut dix sessions \xE0 l'aveugle."},lures:[{name:"Shad souple 10-12 cm t\xEAte plomb\xE9e l\xE9g\xE8re",color:"Ayu / naturel / paillettes par grand soleil",weight:"7-14 g",technique:"Lin\xE9aire lent dans 40-80 cm d'eau sur l'estran recouvert. Adapter \xE0 la proie : shad 10 cm sur sprats, plus grand si sardines."},{name:"Souple weightless sur les tables",color:"Naturel / blanc",weight:"7-10 g mont\xE9 sans plomb",technique:"Passage \xE0 fleur d'eau au-dessus des structures, l\xE0 o\xF9 un leurre plomb\xE9 accrocherait. Le co\xFBt faible autorise les zones encombr\xE9es."},{name:"Stickbait 110-140 mm",color:"Ghost / Iwashi / blanc en basse lumi\xE8re",weight:"14-25 g",technique:"Walking the dog au cr\xE9puscule sur le flot, le long des \xE9pis. Patchinko 125 ou Asturie 110 en r\xE9f\xE9rence perso."}],access:"Acc\xE8s direct depuis Pirou Plage, parkings en front de mer. Aucune difficult\xE9.",securite:[{t:"Estran plat \xE0 fort marnage : le flot gagne vite et peut passer par les b\xE2ches et les chenaux. Rep\xE9rer sa ligne de retour avant de s'avancer.",s:"prudence g\xE9n\xE9rale (d\xE9duit)"}]},{id:"regneville",tidePort:"regneville",isLocal:!0,zone:"local",dangerLevel:2,name:"R\xE9gn\xE9ville",subtitle:"Havre et embouchure de la Sienne",distance:"\u2248 35 min",distMin:35,coords:"49\xB001'N 1\xB034'W",type:"EMBOUCHURE / HAVRE",color:"#4ade80",terrain:{fond:"Sable et sablo-vase, chenal de vidange marqu\xE9 ; roche affleurante par endroits \xE0 basse mer.",encombrement:1,gratter:"oui",prof:{cls:"peu",why:"Chenal de vidange du havre ; la fiche r\xE8gle le plomb sur le courant plus que sur la profondeur."},couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte plomb\xE9e r\xE9gl\xE9e sur le courant du chenal ; texan sur les bancs (r\xE9f\xE9rence Black Minnow).",conseils:["Ne jamais traverser le havre \xE0 pied seul : la travers\xE9e se fait \xE0 mar\xE9e basse et accompagn\xE9e (Attitude Manche).","Le plombage se r\xE8gle sur la vitesse du courant, pas sur la profondeur.","Spot de ton guide d'origine : aucune source publi\xE9e v\xE9rifi\xE9e ne le cite pour le bar (29/10/2026) ; ton journal fera foi."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"Le havre de la Sienne se traverse \xE0 pied \xE0 mar\xE9e basse seulement, accompagn\xE9 : \xAB trop dangereux seul \xBB. Il est s\xE9par\xE9 de la mer par l'espace naturel class\xE9 de la pointe d'Agon.",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"}]},coefBand:[50,70,90,110],houleMax:1.5,exposedAngles:[247.5,270],shelteredAngles:[45,67.5,90,112.5],weatherNote:"Havre partiellement abrit\xE9 par le cordon dunaire. Reste ouvert au secteur ouest \xE0 pleine mer.",sources:["cirkwi.com \u2014 Le havre de Sienne (Attitude Manche)","sylco-peche-brehal.fr \u2014 'La Sienne est une tr\xE8s belle rivi\xE8re' ; le secteur est pr\xE9sent\xE9 comme zone de p\xEAche du bord reconnue de la c\xF4te des havres","cpiecotentin.com \u2014 g\xE9omorphologie de la c\xF4te des havres, estrans rocheux d\xE9couvrant \xE0 mar\xE9e basse","peche.com \u2014 principe g\xE9n\xE9ral des embouchures et du flot sur estran"],topology:{fond:{text:"Sable et sablo-vase, chenal de vidange bien marqu\xE9, bancs mobiles de part et d'autre. L'estran rocheux affleure par endroits \xE0 basse mer.",confidence:"verified"},structure:{text:"Embouchure de la Sienne : le havre stocke une masse d'eau consid\xE9rable \xE0 chaque mar\xE9e et la restitue par un chenal \xE9troit. Configuration d'entonnoir, la plus lisible du secteur.",confidence:"local_knowledge"},exposition:{text:"Le cordon dunaire casse la houle d'ouest sur la partie interne. La sortie de chenal reste expos\xE9e par vent d'O soutenu.",confidence:"local_knowledge"},courant:{text:"Tr\xE8s fort dans le chenal en vive-eau, bien plus que sur l'estran ouvert. C'est le moteur du spot et sa principale contrainte.",confidence:"inference"},bars:{text:"Poste d'interception classique : le bar se cale en sortie de chenal et filtre le flux sortant charg\xE9 de proies. Gradient de salinit\xE9 attractif. Le secteur est cit\xE9 comme zone de p\xEAche appr\xE9ci\xE9e des locaux.",confidence:"verified"}},tidalRules:{typeHeure:"DESCENDANT \xC9TABLI",montantOuDescendant:"Descendant nettement dominant : c'est la vidange du havre qui concentre la nourriture. Le montant fonctionne en fin de flot, quand les bars remontent dans le havre.",description:"Le spot le plus r\xE9gulier du secteur sur la mar\xE9e descendante. On p\xEAche la veine du chenal en d\xE9rive, contact permanent avec le leurre.",windows:[{id:"re1",label:"PM+1h \u2192 PM+4h30 (jusant)",phase:"pm",offsetBefore:1,offsetAfter:4.5,tidePhaseType:"descendant",priority:"prime",note:"Vidange pleine du havre. Lancer en amont, laisser d\xE9river le souple dans la veine. Adapter le plombage \xE0 la vitesse : 12 \xE0 25 g."},{id:"re2",label:"Fin de montant",phase:"pm",offsetBefore:-2.5,offsetAfter:-.5,tidePhaseType:"montant",priority:"bon",note:"Les bars remontent dans le havre avec le flot. Prospection plus large, plus lente, moins de courant."}],lifeHack:"Ne jamais traverser le chenal, m\xEAme \xE0 basse mer apparente : les bancs sont mobiles et le flot reprend par l'arri\xE8re. Rep\xE9rer un point de repli visible avant de commencer."},lures:[{name:"Shad souple t\xEAte plomb\xE9e lourde",color:"Naturel / blanc en eau teint\xE9e",weight:"12-25 g selon courant",technique:"D\xE9rive dans la veine du chenal, contact permanent. Le plombage se r\xE8gle sur la vitesse du courant, pas sur la profondeur."},{name:"Black Minnow 120",color:"Ayu / kaki",weight:"t\xEAte 12-18 g",technique:"R\xE9f\xE9rence Cotentin cit\xE9e par peche.com pour la p\xEAche du bord. Hame\xE7on texan limitant les croches sur les bancs."},{name:"Minnow \xE0 bavette 110-130 mm",color:"Dos sombre en eau teint\xE9e",weight:"14-20 g",technique:"R\xE9cup\xE9ration lente en travers du flux sortant, quand l'eau est charg\xE9e et que le souple passe inaper\xE7u."}],access:"Parkings du havre de R\xE9gn\xE9ville. Marche sur banc de sable jusqu'aux postes. Bottes ou waders selon le poste.",securite:[{t:"Ne jamais traverser le havre \xE0 pied seul : travers\xE9e \xE0 mar\xE9e basse et accompagn\xE9e seulement (\xAB trop dangereux seul \xBB).",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"},{t:"Ne jamais traverser le chenal, m\xEAme \xE0 basse mer apparente : les bancs sont mobiles et le flot reprend par l'arri\xE8re. Rep\xE9rer un point de repli visible.",s:"fiche du spot (conseil)"}]},{id:"gouville",tidePort:"gouville",isLocal:!0,zone:"local",dangerLevel:3,name:"Gouville-sur-Mer",subtitle:"Parcs et estran (le S\xE9n\xE9quet est au large : pas un poste du bord)",distance:"20 min",distMin:20,coords:"49\xB005'N 1\xB036'W",type:"PARCS + ESTRAN ROCHEUX",color:"#4ade80",terrain:{fond:"Estran mixte : sable, roches affleurantes, parcs ostr\xE9icoles \xE9tendus. Le phare du S\xE9n\xE9quet est \xAB situ\xE9 \xE0 plusieurs kilom\xE8tres du rivage \xBB (Tendance Ouest).",encombrement:2,gratter:"texan",prof:{cls:"estran",why:"\xAB Vaste estran rocheux et sableux \xBB de 3 866 ha (INPN) : tr\xE8s peu d'eau \xE0 mar\xE9e basse."},couches:["surface","sous-surface","mi-eau","fond"],montage:"Weightless entre les tables ; t\xEAte plomb\xE9e l\xE9g\xE8re seulement sur le sable d\xE9gag\xE9, pr\xE8s du bord.",conseils:["La zone des parcs interdit le plomb\xE9 : on y p\xEAche en surface ou juste dessous."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"ZNIEFF marine \xAB Estran rocheux de Gouville \xE0 Agon-Coutainville \xBB : \xAB vaste estran rocheux et sableux \xBB de 3 866 ha, du phare du S\xE9n\xE9quet \xE0 la tour du Ronquet.",s:"INPN \u2014 ZNIEFF 25M000020"},{t:"On y trouve des herbiers de zost\xE8res (Zostera marina et noltei), des r\xE9cifs d'hermelles temporaires et des platiers \xE0 algues rouges ; granulom\xE9trie de la vase aux blocs.",s:"INPN \u2014 ZNIEFF 25M000020"},{t:"Le phare du S\xE9n\xE9quet est \xAB situ\xE9 \xE0 plusieurs kilom\xE8tres du rivage de Gouville \xBB, \xAB accessible uniquement lors des \xE9pisodes de grandes mar\xE9es \xBB ; le 1er mars 2025, une personne y a \xE9t\xE9 retrouv\xE9e morte dans les rochers, la mar\xE9e montante mena\xE7ant d'isoler le groupe.",s:"tendanceouest.com \u2014 C. Caradec, \xAB Manche. Grandes mar\xE9es : une personne retrouv\xE9e morte pr\xE8s du phare du S\xE9n\xE9quet \xBB (02/03/2025)"}]},coefBand:[50,70,90,110],houleMax:1.8,exposedAngles:[247.5,270,292.5],shelteredAngles:[67.5,90],weatherNote:"Exposition ouest franche. Les parcs cassent partiellement le clapot par vent mod\xE9r\xE9.",sources:["inpn.mnhn.fr \u2014 ZNIEFF marine 25M000020 Estran rocheux de Gouville \xE0 Agon-Coutainville","sylco-peche-brehal.fr \u2014 'Le S\xE9n\xE9quet \xE0 Gouville-sur-Mer' cit\xE9 comme tr\xE8s appr\xE9ci\xE9 des p\xEAcheurs locaux (page non rev\xE9rifi\xE9e le 29/10/2026)","tendanceouest.com \u2014 accident du S\xE9n\xE9quet (02/03/2025)","cpiecotentin.com \u2014 estrans rocheux d\xE9couvrant \xE0 mar\xE9e basse sur ce lin\xE9aire","peche.com \u2014 principes des plateaux rocheux et du flot sur estran"],topology:{fond:{text:"\xAB Vaste estran rocheux et sableux \xBB (INPN) ; parcs ostr\xE9icoles \xE9tendus.",confidence:"verified"},structure:{text:"Les tables ostr\xE9icoles structurent l'estran c\xF4t\xE9 terre. Le S\xE9n\xE9quet, \xE0 plusieurs kilom\xE8tres au large, n'est accessible qu'aux grandes mar\xE9es : ce n'est pas un poste du guide.",confidence:"verified"},exposition:{text:"Ouest franc. Vent d'E/NE terrestre = mer plate et eau claire, exigeant de la discr\xE9tion. Vent d'O = houle courte sur l'estran, souvent favorable jusqu'\xE0 4 Beaufort.",confidence:"local_knowledge"},courant:{text:"Courant parall\xE8le \xE0 la c\xF4te, acc\xE9l\xE9r\xE9 autour du plateau et entre les rang\xE9es de parcs.",confidence:"inference"},bars:{text:"Spot de ton guide d'origine, cit\xE9 comme appr\xE9ci\xE9 des p\xEAcheurs locaux (sylco, non rev\xE9rifi\xE9). Le bar longe les rang\xE9es de tables au flot comme il longerait une bordure rocheuse (d\xE9duit).",confidence:"local_knowledge"}},tidalRules:{typeHeure:"MONTANT SUR LES PARCS",montantOuDescendant:"Montant dominant pour les parcs et l'estran (ton guide d'origine).",description:"Les parcs se p\xEAchent au flot en suivant l'eau ; au jusant, les roches affleurantes proches du bord (d\xE9duit). Jamais vers le S\xE9n\xE9quet.",windows:[{id:"go1",label:"Mi-montant \u2192 PM-1h",phase:"pm",offsetBefore:-3.5,offsetAfter:-1,tidePhaseType:"montant",priority:"prime",note:"Parcs recouverts, bars en chasse le long des rang\xE9es. Souple weightless ou t\xEAte plomb\xE9e tr\xE8s l\xE9g\xE8re pour \xE9viter les croches."},{id:"go2",label:"Mi-descendant, roches proches du bord",phase:"pm",offsetBefore:1.5,offsetAfter:3.5,tidePhaseType:"descendant",priority:"bon",note:"L'eau se retire des roches affleurantes proches du bord (d\xE9duit). Ne pas suivre la mer vers le large."},{id:"go3",label:"D\xE9but de flot (BM+0,5 \u2192 BM+2,5)",phase:"bm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"montant",priority:"prime",note:"Premiers centim\xE8tres sur l'estran, depuis le haut de plage. La lumi\xE8re du cr\xE9neau est calcul\xE9e \xE0 part."}],lifeHack:"Les parcs coupent : semelles \xE9paisses obligatoires. Et le flot remonte entre les tables plus vite qu'il n'y para\xEEt \u2014 garder toujours une ligne de retraite d\xE9gag\xE9e."},lures:[{name:"Souple weightless entre les tables",color:"Naturel / Ayu",weight:"7-10 g sans plomb",technique:"Passage \xE0 fleur d'eau au-dessus des structures. La zone encombr\xE9e interdit le plomb\xE9."},{name:"Shad 10-12 cm t\xEAte plomb\xE9e",color:"Naturel",weight:"10-18 g",technique:"Sur le sable d\xE9gag\xE9 pr\xE8s du bord. R\xE9cup\xE9ration lente avec pauses."},{name:"Stickbait 120-140 mm",color:"Ghost / Iwashi",weight:"16-25 g",technique:"Surface au cr\xE9puscule sur les parcs recouverts, quand des chasses marquent."}],access:"Nombreux acc\xE8s plage \xE0 Gouville, parkings des cabines. Marche variable selon le coefficient.",securite:[{t:"Ne pas suivre la mer vers le S\xE9n\xE9quet : le phare est \xAB \xE0 plusieurs kilom\xE8tres du rivage \xBB, accessible seulement aux grandes mar\xE9es ; une personne y est morte le 1er mars 2025, le groupe menac\xE9 d'\xEAtre isol\xE9 par la mar\xE9e montante.",s:"tendanceouest.com (02/03/2025)"},{t:"Le flot remonte entre les tables plus vite qu'il n'y para\xEEt : garder une ligne de retraite d\xE9gag\xE9e. Parcs coupants : semelles \xE9paisses.",s:"fiche du spot (conseil)"}]},{id:"agon",tidePort:"agon",isLocal:!0,zone:"local",dangerLevel:3,name:"Pointe d'Agon",subtitle:"Banc de sable et confluence du havre",distance:"25 min",distMin:25,coords:"49\xB001'N 1\xB035'W",type:"POINTE SABLEUSE / VEINE",color:"#84cc16",terrain:{fond:"Banc de sable pur et mobile, fosses lat\xE9rales creus\xE9es par le courant.",encombrement:1,gratter:"oui",prof:{cls:"peu",why:"Banc de sable et fosses lat\xE9rales creus\xE9es par le courant (fiche)."},couches:["surface","sous-surface","mi-eau","fond"],montage:"Long bill minnow en tr\xE8s peu d'eau ; souple lourd en d\xE9rive dans la veine.",conseils:["Ne jamais traverser le havre \xE0 pied seul : la travers\xE9e se fait \xE0 mar\xE9e basse et accompagn\xE9e (Attitude Manche).","Les bancs bougent \xE0 chaque temp\xEAte : relire la pointe \xE0 mar\xE9e basse."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"L'estran rocheux et sableux de la ZNIEFF Gouville\u2013Agon s'\xE9tend jusqu'\xE0 la tour du Ronquet, au large d'Agon-Coutainville.",s:"INPN \u2014 ZNIEFF 25M000020"},{t:"Le havre de la Sienne se traverse \xE0 pied \xE0 mar\xE9e basse seulement, accompagn\xE9 : \xAB trop dangereux seul \xBB.",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"}]},coefBand:[50,70,90,110],houleMax:1.7,exposedAngles:[247.5,270,292.5],shelteredAngles:[90,112.5],weatherNote:"Pointe tr\xE8s expos\xE9e \xE0 l'ouest, sans aucun abri. Le vent y est toujours plus fort que sur la plage voisine.",sources:["inpn.mnhn.fr \u2014 ZNIEFF marine 25M000020","cirkwi.com \u2014 Le havre de Sienne (Attitude Manche)","Guide p\xEAche Latitude Manche \u2014 'Sur les bancs de sable de la pointe d'Agon, \xE0 mar\xE9e montante, on peut utiliser des leurres plongeants type long bill minnow ou un buldo pour rechercher les bars pr\xE9sents dans 50 cm d'eau' ; avertissement explicite : 'attention \xE0 ne pas se laisser entourer \xE0 mar\xE9e montante'","sylco-peche-brehal.fr \u2014 le phare du Ronquet en face d'Agon-Coutainville, tr\xE8s appr\xE9ci\xE9 des p\xEAcheurs locaux","cpiecotentin.com \u2014 g\xE9omorphologie des havres et pointes sableuses"],topology:{fond:{text:"Banc de sable pur, mobile, prolongeant la pointe. Fosses lat\xE9rales creus\xE9es par le courant de vidange du havre de la Sienne.",confidence:"verified"},structure:{text:"La pointe s\xE9pare le havre de la mer ouverte et concentre le courant sur son extr\xE9mit\xE9. Configuration de confluence : deux masses d'eau, une veine puissante.",confidence:"local_knowledge"},exposition:{text:"Face ouest, aucune protection. La pointe prend le vent avant tout le reste du secteur.",confidence:"local_knowledge"},courant:{text:"Fort, notamment au jusant quand le havre se vide. La veine contourne la pointe et cr\xE9e un remous exploitable en aval.",confidence:"inference"},bars:{text:"Source Latitude Manche directe : bars pr\xE9sents dans 50 cm d'eau sur les bancs \xE0 mar\xE9e montante, \xE0 rechercher aux leurres plongeants. Poste d'interception classique sur la veine au jusant.",confidence:"verified"}},tidalRules:{typeHeure:"MONTANT SUR BANCS + JUSANT SUR VEINE",montantOuDescendant:"Les deux, mais pas au m\xEAme endroit : le montant se p\xEAche sur les bancs en tr\xE8s peu d'eau, le jusant se p\xEAche dans la veine de vidange.",description:"Spot \xE0 double r\xE9gime. La s\xE9curit\xE9 commande : la pointe s'isole vite et le flot la contourne par l'arri\xE8re.",windows:[{id:"ag1",label:"Montant sur les bancs",phase:"pm",offsetBefore:-4,offsetAfter:-1.5,tidePhaseType:"montant",priority:"prime",note:"Source Latitude Manche : bars dans 50 cm d'eau, leurre plongeant type long bill minnow. Avancer avec l'eau, jamais s'attarder."},{id:"ag2",label:"PM+1h \u2192 PM+3h30 (veine)",phase:"pm",offsetBefore:1,offsetAfter:3.5,tidePhaseType:"descendant",priority:"prime",note:"Vidange du havre contournant la pointe. Souple lourd en d\xE9rive dans la veine, prospection du remous aval."},{id:"ag3",label:"D\xE9but de flot (BM+0,5 \u2192 BM+2)",phase:"bm",offsetBefore:.5,offsetAfter:2,tidePhaseType:"montant",priority:"bon",note:"Premier flot sur les bancs. Stickbait si la mer le permet ; ne jamais se laisser entourer (Latitude Manche)."}],lifeHack:"Danger r\xE9el d'encerclement, signal\xE9 noir sur blanc par le guide d\xE9partemental. Fixer une heure de repli AVANT de partir et s'y tenir, m\xEAme si \xE7a mord."},lures:[{name:"Long bill minnow / leurre plongeant",color:"Naturel argent",weight:"14-22 g",technique:"Source Latitude Manche directe : prospection des bancs en tr\xE8s peu d'eau \xE0 mar\xE9e montante."},{name:"Souple lourd en d\xE9rive",color:"Blanc / naturel",weight:"14-25 g",technique:"Dans la veine de vidange au jusant. Le plombage se r\xE8gle sur le courant."},{name:"Stickbait 125-140 mm",color:"Ghost / blanc en basse lumi\xE8re",weight:"16-25 g",technique:"Surface au cr\xE9puscule quand la mer est maniable."}],access:"Parking d'Agon-Coutainville puis longue marche sur la pointe. Compter le trajet retour dans le calcul de mar\xE9e.",securite:[{t:"Mar\xE9e montante sur les bancs : attention \xE0 ne pas se laisser entourer.",s:"Latitude Manche, guide de p\xEAche",when:{phase:"montant"}},{t:"La pointe s'isole vite et le flot la contourne par l'arri\xE8re.",s:"fiche du spot"},{t:"Ne jamais traverser le havre \xE0 pied seul (\xAB trop dangereux seul \xBB).",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"}]},{id:"portbail",tidePort:"portbail",isLocal:!1,zone:"inter",dangerLevel:2,name:"Portbail",subtitle:"Havre, chenal et platier rocheux",distance:"35 min",distMin:35,coords:"49\xB020'N 1\xB043'W",type:"HAVRE + PLATIER",color:"#38bdf8",terrain:{fond:"Chenal sableux \xE9troit bord\xE9 de platiers rocheux.",encombrement:2,gratter:"texan",prof:{cls:"peu",why:"Chenal sableux \xE9troit bord\xE9 de platiers (fiche)."},couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte plomb\xE9e dans le chenal sableux ; texan d\xE8s qu'on aborde le platier.",conseils:["Le platier recouvert se p\xEAche au-dessus (minnow \xE0 bavette), le chenal au fond.","Spot de ton guide d'origine : une seule source, qui ne fait que le nommer (mieuxpecher : \xAB L'Olonde pr\xE8s de PortBail \xBB)."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"\xC0 Portbail, le platier rocheux porte moules, coquilles Saint-Jacques et \xE9trilles.",s:"CPIE du Cotentin \u2014 o\xF9 p\xEAcher"}]},coefBand:[50,70,90,108],houleMax:1.6,exposedAngles:[247.5,270],shelteredAngles:[67.5,90,112.5],weatherNote:"Havre abrit\xE9 c\xF4t\xE9 interne, sortie de chenal expos\xE9e \xE0 l'ouest.",sources:["cpiecotentin.com \u2014 '\xC0 Portbail, le platier rocheux offre moule, coquille Saint-Jacques, \xE9trille et bouquet' ; havre appartenant aux quatre havres de la c\xF4te ouest","peche.com \u2014 principes g\xE9n\xE9raux des embouchures et des plateaux rocheux"],topology:{fond:{text:"Chenal sableux \xE9troit bord\xE9 de platiers rocheux. Le platier est document\xE9 comme riche en crustac\xE9s et coquillages \u2014 donc en nourriture pour le bar.",confidence:"verified"},structure:{text:"Havre plus \xE9troit que celui de la Sienne : le flux de vidange y est plus concentr\xE9, donc les postes sont plus lisibles. Le pont marque un \xE9tranglement suppl\xE9mentaire.",confidence:"inference"},exposition:{text:"Partie interne bien abrit\xE9e par le cordon dunaire. La sortie de chenal reste ouverte au secteur ouest.",confidence:"inference"},courant:{text:"Soutenu dans le chenal, faible sur les platiers. L'\xE9cart entre les deux cr\xE9e les postes.",confidence:"inference"},bars:{text:"Configuration d'entonnoir favorable au postage. La richesse document\xE9e du platier en crustac\xE9s soutient une biomasse locale exploitable par le bar.",confidence:"inference"}},tidalRules:{typeHeure:"DESCENDANT \xC9TABLI + PLATIER \xC0 MI-MAR\xC9E",montantOuDescendant:"Descendant dominant sur le chenal. Le platier se p\xEAche \xE0 mi-mar\xE9e dans les deux sens.",description:"M\xEAme logique que R\xE9gn\xE9ville, \xE0 \xE9chelle plus r\xE9duite et plu  le reste du temps, le courant interdit toute p\xEAche pr\xE9cise."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"Pointe de la Hague : sorties du soir sous les falaises ; shads de 10 cm plomb\xE9s de 12 \xE0 25 g selon le courant pour imiter le sprat, laiss\xE9s descendre \xAB de 1 \xE0 2 m\xE8tres maximum \xBB ; Black Minnow coloris Ayu tr\xE8s efficace ; suivre les oiseaux.",s:"peche.com \u2014 \xAB Sortie de p\xEAche estivale \xE0 la recherche des bars du Cotentin \xBB"},{t:"Les bars de chasse sont souvent calibr\xE9s ; il est \xAB rare de faire de gros poissons lors des chasses \xBB.",s:"peche.com"}]},coefBand:[50,65,80,90],coefHardMax:90,coefHardMaxWhy:"au-del\xE0 de 90, \xAB le courant est tr\xE8s fort \xBB au Raz Blanchard (despoissonssigrands.com) : spot non propos\xE9, par prudence.",houleMax:1.5,exposedAngles:[270,292.5,315,0],shelteredAngles:[157.5,180],weatherNote:"Point le plus expos\xE9 de la c\xF4te. Mer crois\xE9e fr\xE9quente, vent renforc\xE9 par l'effet de cap.",sources:["peche.com \u2014 Sortie de p\xEAche estivale \xE0 la recherche des bars du Cotentin","peche.com \u2014 P\xEAche du bar du bord dans le Cotentin : 'Le mythique Cap de la Hague est connu pour abriter l'un des courants les plus puissants au monde avec le fameux Raz Blanchard. Cette zone tr\xE8s mouvement\xE9e est un excellent spot pour la p\xEAche du bar'","despoissonssigrands.com \u2014 \xAB Le phare de Goury marque l'entr\xE9e du Raz Blanchard. Ce violent courant est un excellent spot pour la p\xEAche du bar \xBB ; coefficient pr\xE9f\xE9r\xE9 \xAB entre 70 et 90 \xBB ; au-del\xE0, en bateau, d\xE9rive \xAB sup\xE9rieure \xE0 6 n\u0153uds \xBB sur des spots du nord \u2014 https://despoissonssigrands.com/lescarnetsdepeche/peche-du-bar-en-automne-retour-sur-une-excellente-sortie-dans-le-cotentin","peche.com \u2014 technique : privil\xE9gier la fin de la descendante et le d\xE9but de la remontante, jusqu'\xE0 2h-2h30 apr\xE8s le basculement"],topology:{fond:{text:"Roche franche, estran rocheux, tombants profonds. Fonds extr\xEAmement brass\xE9s par le courant du raz.",confidence:"verified"},structure:{text:"Le phare de Goury marque l'entr\xE9e du Raz Blanchard, l'un des courants les plus puissants au monde. Remous permanents, veines et contre-courants sur toute la zone.",confidence:"verified"},exposition:{text:"Expos\xE9 du sud-ouest au nord. Aucun abri r\xE9el. Mer crois\xE9e quand le vent contrarie le courant.",confidence:"inference"},courant:{text:"Extr\xEAme. peche.com (bord, Cotentin) : au plus fort du courant, il est compliqu\xE9 de p\xEAcher correctement. despoissonssigrands.com (en bateau) : au-del\xE0 du coefficient 90, la d\xE9rive d\xE9passe 6 n\u0153uds sur des spots du nord.",confidence:"verified"},bars:{text:"Zone qualifi\xE9e d'excellent spot pour la p\xEAche du bar par deux sources ind\xE9pendantes. Oxyg\xE9nation et biomasse maximales, poissons de passage, gabarits sup\xE9rieurs. Mais fen\xEAtres praticables \xE9troites.",confidence:"verified"}},tidalRules:{typeHeure:"FIN DE JUSANT \u2192 BM+2h30",montantOuDescendant:"La r\xE8gle est explicite dans la source : fin de la descendante et d\xE9but de la remontante, jusqu'\xE0 2h \xE0 2h30 apr\xE8s le basculement. \xC0 ce moment le flot recouvre l'estran et les bars le suivent.",description:"Le spot le plus puissant et le plus dangereux de la liste. Les fen\xEAtres sont dict\xE9es par le courant, pas par les pr\xE9f\xE9rences du p\xEAcheur.",windows:[{id:"gy1",label:"Fin de jusant \u2192 BM+2h30",phase:"bm",offsetBefore:-1.5,offsetAfter:2.5,tidePhaseType:"montant",priority:"prime",note:"Pratique de l'auteur de peche.com au cap de la Hague. Attention : le jusant du raz est \xE0 son maximum \xAB vers l'heure de la basse mer de Cherbourg \xBB (Wikip\xE9dia) \u2014 poste haut, \xE0 l'abri du courant. Black Minnow 120 sur t\xEAte 12-18 g."},{id:"gy2",label:"Pleine mer (plein courant du raz)",phase:"pm",offsetBefore:-1,offsetAfter:1,tidePhaseTy
