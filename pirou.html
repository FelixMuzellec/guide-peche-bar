ef \u2265 60, jusqu'\xE0 \xB140 min en morte-eau ; basses mers jusqu'\xE0 \xB160 min ; hauteurs \xB10,2 \xE0 0,3 m"},surtainville:{label:"Surtainville (interpol\xE9)",kind:"interp",a:"portbail",b:"dielette",w:.528,accuracy:"Interpol\xE9 Portbail/Di\xE9lette, non contr\xF4l\xE9 sur place. M\xEAme m\xE9thode qu'\xE0 Pirou, o\xF9 l'\xE9cart mesur\xE9 est : pleines mers \xB112 min si coef \u2265 60, jusqu'\xE0 \xB140 min en morte-eau ; basses mers jusqu'\xE0 \xB160 min ; hauteurs \xB10,2 \xE0 0,3 m"},sciotot:{label:"Sciotot (interpol\xE9)",kind:"interp",a:"portbail",b:"dielette",w:.835,accuracy:"Interpol\xE9 Portbail/Di\xE9lette, non contr\xF4l\xE9 sur place. M\xEAme m\xE9thode qu'\xE0 Pirou, o\xF9 l'\xE9cart mesur\xE9 est : pleines mers \xB112 min si coef \u2265 60, jusqu'\xE0 \xB140 min en morte-eau ; basses mers jusqu'\xE0 \xB160 min ; hauteurs \xB10,2 \xE0 0,3 m"}}},sstTypical:[8.2,17.8]},tp={title:"Principes g\xE9n\xE9raux \u2014 p\xEAche du bar du bord en Cotentin ouest",items:[{rule:"Coefficient 70-90 : la pr\xE9f\xE9rence d'un p\xEAcheur du Cotentin",source:"despoissonssigrands.com \u2014 \xAB P\xEAche du bar en automne : retour sur une excellente sortie dans le Cotentin \xBB (r\xE9cit d'une sortie en bateau)",explain:"\xAB J'appr\xE9cie un coefficient de mar\xE9e entre 70 et 90. \xBB Au-dessus, \xAB le courant est tr\xE8s fort \xBB : en bateau, \xAB certains spots du nord de la c\xF4te sont quasiment impossibles \xE0 p\xEAcher \xBB, la d\xE9rive d\xE9passant 6 n\u0153uds. C'est une pr\xE9f\xE9rence personnelle, tir\xE9e d'une sortie en bateau ; faute de source propre \xE0 chaque spot du bord, le guide s'en sert comme plage de r\xE9f\xE9rence."},{rule:"Sur les spots \xE0 courant violent, p\xEAcher la fin de descendante et le d\xE9but de montante",source:"peche.com \u2014 P\xEAche du bar du bord dans le Cotentin",explain:"Au plus fort du courant il est compliqu\xE9 de p\xEAcher correctement. La fen\xEAtre utile va jusqu'\xE0 2h-2h30 apr\xE8s le basculement : \xE0 ce moment le flot vient recouvrir l'estran et les bars le suivent. C'est la r\xE8gle structurante de toute la c\xF4te, et elle prime sur les pr\xE9f\xE9rences de spot."},{rule:"Le flot qui recouvre l'estran est le moteur de la c\xF4te des havres",source:"peche.com / cpiecotentin.com",explain:"De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses entrecoup\xE9es de quatre havres, qui d\xE9couvrent \xE0 mar\xE9e basse sur des estrans rocheux. Le marnage \xE9norme met \xE0 nu des kilom\xE8tres d'estran ; les bars entrent avec les premiers centim\xE8tres d'eau pour exploiter ce garde-manger remis en suspension."},{rule:"Prospecter tr\xE8s peu profond sur les bancs de sable au montant",source:"Guide p\xEAche Latitude Manche (Conseil d\xE9partemental de la Manche)",explain:"Sur les bancs de la pointe de sable d'Agon, \xE0 mar\xE9e montante, on recherche les bars pr\xE9sents dans 50 cm d'eau, aux leurres plongeants type long bill minnow ou au buldo. Corollaire de s\xE9curit\xE9 explicite dans la m\xEAme source : attention \xE0 ne pas se laisser entourer par la mar\xE9e."},{rule:"Adapter la taille du leurre \xE0 la proie du moment",source:"peche.com \u2014 sorties Cotentin",explain:"En pr\xE9sence de sprats d'une dizaine de centim\xE8tres, des shads de 10 cm plomb\xE9s de 12 \xE0 25 g selon profondeur et courant. En pr\xE9sence de sardines, monter en taille. Par fort ensoleillement, les leurres \xE0 paillettes sortent clairement du lot. Les oiseaux restent le meilleur indicateur de chasse."},{rule:"Mat\xE9riel : longueur de canne pour lancer loin des leurres l\xE9gers",source:"peche.com \u2014 P\xEAche du bar du bord dans le Cotentin",explain:"Cannes de 2,30 m \xE0 2,40 m, puissances de 5/15 g \xE0 10/30 g. La contrainte dominante du bord en Cotentin est la capacit\xE9 \xE0 lancer loin des leurres relativement l\xE9gers, sur des estrans plats o\xF9 le poisson peut \xEAtre \xE0 distance."}]},Ae=[{id:"pirou",tidePort:"pirou",isLocal:!0,zone:"local",dangerLevel:1,name:"Pirou Plage",subtitle:"Estran, \xE9pis et tables, Pirou",distance:"sur place",distMin:0,coords:"49\xB010'N 1\xB035'W",type:"ESTRAN SABLEUX + TABLES",color:"#22c55e",terrain:{fond:"Sable dominant sur l'estran ; tables ostr\xE9icoles et bouchots en secteurs.",encombrement:2,gratter:"oui",couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte plomb\xE9e l\xE9g\xE8re sur le sable ; weightless au-dessus des tables, o\xF9 un plomb\xE9 accroche.",conseils:["Sur le sable, p\xEAcher pr\xE8s du fond dans les 40 \xE0 80 premiers centim\xE8tres d'eau du flot.","Aux tables, passer au-dessus des structures, jamais entre les pieds."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"\xAB De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses, entrecoup\xE9es par quatre havres. \xBB",s:"CPIE du Cotentin \u2014 o\xF9 p\xEAcher"},{t:"Des p\xEAcheurs locaux p\xEAchent le bar au leurre souple sur les bouchots et les tables \xE0 hu\xEEtres de Pirou plage.",s:"Forum P\xEAche en mer Cotentin \u2014 \xAB p\xEAche au bar \xBB"}]},coefBand:[50,70,90,110],coefMin:70,coefIdeal:90,coefMax:110,houleMax:2,exposedAngles:[247.5,270,292.5],shelteredAngles:[67.5,90,112.5],weatherNote:"Plein ouest, aucune protection. Le vent d'O/SO monte directement sur l'estran ; le vent d'E aplatit et clarifie.",sources:["pechemercotentin.forumactif.org \u2014 sujet \xAB p\xEAche au bar \xBB","cpiecotentin.com \u2014 'De Pirou \xE0 Barneville-Carteret s'\xE9tendent de grandes plages sableuses, entrecoup\xE9es par quatre havres, qui d\xE9couvrent \xE0 mar\xE9e basse sur des estrans rocheux'","pechemercotentin.forumactif.org \u2014 p\xEAcheurs locaux au leurre souple sur Pirou plage, travaillant les bouchots et tables \xE0 hu\xEEtres, bons poissons en avril","peche.com \u2014 P\xEAche du bar du bord dans le Cotentin (technique g\xE9n\xE9rale du flot sur estran)"],topology:{fond:{text:"Sable dominant, estran tr\xE8s plat d\xE9couvrant loin, secteurs de tables ostr\xE9icoles et bouchots. Fosses de retour parall\xE8les au rivage creus\xE9es par la houle.",confidence:"verified"},structure:{text:"Les tables et bouchots forment un r\xE9cif artificiel : abri, biomasse fix\xE9e, ralentissement du courant. Les p\xEAcheurs locaux du secteur les citent explicitement comme zone de travail au leurre souple.",confidence:"verified"},exposition:{text:"Face plein ouest, fetch de plus de 100 km. Rien ne casse la houle d'O/NO. Le vent d'est terrestre aplatit la mer et \xE9claircit l'eau.",confidence:"local_knowledge"},courant:{text:"Courant de mar\xE9e parall\xE8le \xE0 la c\xF4te, mod\xE9r\xE9 sur l'estran ouvert, acc\xE9l\xE9r\xE9 dans les fosses de retour et entre les rang\xE9es de tables.",confidence:"inference"},bars:{text:"Bars de bordure entrant avec le flot pour exploiter vers, coques et crevettes remis en suspension. Poissons souvent calibr\xE9s, chasses possibles en fin de journ\xE9e. Prises document\xE9es au printemps par les p\xEAcheurs du secteur.",confidence:"verified"}},tidalRules:{typeHeure:"MONTANT SUR ESTRAN + CR\xC9PUSCULES",montantOuDescendant:"Montant nettement dominant : c'est le flot recouvrant l'estran qui d\xE9clenche l'entr\xE9e des bars. Le descendant fonctionne surtout dans les fosses de retour, quand l'eau se vidange.",description:"Spot de base, accessible en permanence. On p\xEAche le flot qui remonte l'estran, en avan\xE7ant avec lui, et on travaille les tables d\xE8s qu'elles sont recouvertes de 40 \xE0 80 cm d'eau.",windows:[{id:"pi1",label:"Mi-montant \u2192 PM-1h",phase:"pm",offsetBefore:-3.5,offsetAfter:-1,tidePhaseType:"montant",priority:"prime",note:"Le flot recouvre l'estran et les tables. Suivre l'eau qui monte, lancer devant soi dans 40-80 cm. Shad 10 cm plomb\xE9 l\xE9ger ou souple weightless."},{id:"pi2",label:"D\xE9but de montant sur BM",phase:"bm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"montant",priority:"prime",note:"Les tout premiers centim\xE8tres d'eau sur l'estran d\xE9couvert. Bars tr\xE8s peu profonds, souvent \xE0 moins de 20 m du bord. Approche discr\xE8te obligatoire."},{id:"pi3",label:"Descendant dans les fosses",phase:"pm",offsetBefore:1.5,offsetAfter:3.5,tidePhaseType:"descendant",priority:"bon",note:"L'eau se vidange par les fosses de retour et y concentre les proies. Prospecter parall\xE8lement au rivage, pas perpendiculairement."}],lifeHack:"Rep\xE9rer les fosses et les ba\xEFnes \xE0 basse mer par grand coefficient : ce sont les veines que les bars empruntent au flot. Une photo a\xE9rienne \xE0 BM vaut dix sessions \xE0 l'aveugle."},lures:[{name:"Shad souple 10-12 cm t\xEAte plomb\xE9e l\xE9g\xE8re",color:"Ayu / naturel / paillettes par grand soleil",weight:"7-14 g",technique:"Lin\xE9aire lent dans 40-80 cm d'eau sur l'estran recouvert. Adapter \xE0 la proie : shad 10 cm sur sprats, plus grand si sardines."},{name:"Souple weightless sur les tables",color:"Naturel / blanc",weight:"7-10 g mont\xE9 sans plomb",technique:"Passage \xE0 fleur d'eau au-dessus des structures, l\xE0 o\xF9 un leurre plomb\xE9 accrocherait. Le co\xFBt faible autorise les zones encombr\xE9es."},{name:"Stickbait 110-140 mm",color:"Ghost / Iwashi / blanc en basse lumi\xE8re",weight:"14-25 g",technique:"Walking the dog au cr\xE9puscule sur le flot, le long des \xE9pis. Patchinko 125 ou Asturie 110 en r\xE9f\xE9rence perso."}],access:"Acc\xE8s direct depuis Pirou Plage, parkings en front de mer. Aucune difficult\xE9.",securite:[{t:"Estran plat \xE0 fort marnage : le flot gagne vite et peut passer par les b\xE2ches et les chenaux. Rep\xE9rer sa ligne de retour avant de s'avancer.",s:"prudence g\xE9n\xE9rale (d\xE9duit)"}]},{id:"regneville",tidePort:"regneville",isLocal:!0,zone:"local",dangerLevel:2,name:"R\xE9gn\xE9ville",subtitle:"Havre et embouchure de la Sienne",distance:"15 min",distMin:15,coords:"49\xB001'N 1\xB034'W",type:"EMBOUCHURE / HAVRE",color:"#4ade80",terrain:{fond:"Sable et sablo-vase, chenal de vidange marqu\xE9 ; roche affleurante par endroits \xE0 basse mer.",encombrement:1,gratter:"oui",couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte plomb\xE9e r\xE9gl\xE9e sur le courant du chenal ; texan sur les bancs (r\xE9f\xE9rence Black Minnow).",conseils:["Ne jamais traverser le havre \xE0 pied seul : la travers\xE9e se fait \xE0 mar\xE9e basse et accompagn\xE9e (Attitude Manche).","Le plombage se r\xE8gle sur la vitesse du courant, pas sur la profondeur."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"Le havre de la Sienne se traverse \xE0 pied \xE0 mar\xE9e basse seulement, accompagn\xE9 : \xAB trop dangereux seul \xBB. Il est s\xE9par\xE9 de la mer par l'espace naturel class\xE9 de la pointe d'Agon.",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"}]},coefBand:[50,70,90,110],coefMin:70,coefIdeal:90,coefMax:110,houleMax:1.5,exposedAngles:[247.5,270],shelteredAngles:[45,67.5,90,112.5],weatherNote:"Havre partiellement abrit\xE9 par le cordon dunaire. Reste ouvert au secteur ouest \xE0 pleine mer.",sources:["cirkwi.com \u2014 Le havre de Sienne (Attitude Manche)","sylco-peche-brehal.fr \u2014 'La Sienne est une tr\xE8s belle rivi\xE8re' ; le secteur est pr\xE9sent\xE9 comme zone de p\xEAche du bord reconnue de la c\xF4te des havres","cpiecotentin.com \u2014 g\xE9omorphologie de la c\xF4te des havres, estrans rocheux d\xE9couvrant \xE0 mar\xE9e basse","peche.com \u2014 principe g\xE9n\xE9ral des embouchures et du flot sur estran"],topology:{fond:{text:"Sable et sablo-vase, chenal de vidange bien marqu\xE9, bancs mobiles de part et d'autre. L'estran rocheux affleure par endroits \xE0 basse mer.",confidence:"verified"},structure:{text:"Embouchure de la Sienne : le havre stocke une masse d'eau consid\xE9rable \xE0 chaque mar\xE9e et la restitue par un chenal \xE9troit. Configuration d'entonnoir, la plus lisible du secteur.",confidence:"local_knowledge"},exposition:{text:"Le cordon dunaire casse la houle d'ouest sur la partie interne. La sortie de chenal reste expos\xE9e par vent d'O soutenu.",confidence:"local_knowledge"},courant:{text:"Tr\xE8s fort dans le chenal en vive-eau, bien plus que sur l'estran ouvert. C'est le moteur du spot et sa principale contrainte.",confidence:"inference"},bars:{text:"Poste d'interception classique : le bar se cale en sortie de chenal et filtre le flux sortant charg\xE9 de proies. Gradient de salinit\xE9 attractif. Le secteur est cit\xE9 comme zone de p\xEAche appr\xE9ci\xE9e des locaux.",confidence:"verified"}},tidalRules:{typeHeure:"DESCENDANT \xC9TABLI",montantOuDescendant:"Descendant nettement dominant : c'est la vidange du havre qui concentre la nourriture. Le montant fonctionne en fin de flot, quand les bars remontent dans le havre.",description:"Le spot le plus r\xE9gulier du secteur sur la mar\xE9e descendante. On p\xEAche la veine du chenal en d\xE9rive, contact permanent avec le leurre.",windows:[{id:"re1",label:"PM+1h \u2192 PM+4h30 (jusant)",phase:"pm",offsetBefore:1,offsetAfter:4.5,tidePhaseType:"descendant",priority:"prime",note:"Vidange pleine du havre. Lancer en amont, laisser d\xE9river le souple dans la veine. Adapter le plombage \xE0 la vitesse : 12 \xE0 25 g."},{id:"re2",label:"Fin de montant",phase:"pm",offsetBefore:-2.5,offsetAfter:-.5,tidePhaseType:"montant",priority:"bon",note:"Les bars remontent dans le havre avec le flot. Prospection plus large, plus lente, moins de courant."},{id:"re3",label:"\xC9tale de BM + reprise",phase:"bm",offsetBefore:-.5,offsetAfter:1.5,tidePhaseType:"montant",priority:"bon",note:"Fen\xEAtre calme o\xF9 le chenal est le seul endroit avec de l'eau. Concentration m\xE9canique du poisson."}],lifeHack:"Ne jamais traverser le chenal, m\xEAme \xE0 basse mer apparente : les bancs sont mobiles et le flot reprend par l'arri\xE8re. Rep\xE9rer un point de repli visible avant de commencer."},lures:[{name:"Shad souple t\xEAte plomb\xE9e lourde",color:"Naturel / blanc en eau teint\xE9e",weight:"12-25 g selon courant",technique:"D\xE9rive dans la veine du chenal, contact permanent. Le plombage se r\xE8gle sur la vitesse du courant, pas sur la profondeur."},{name:"Black Minnow 120",color:"Ayu / kaki",weight:"t\xEAte 12-18 g",technique:"R\xE9f\xE9rence Cotentin cit\xE9e par peche.com pour la p\xEAche du bord. Hame\xE7on texan limitant les croches sur les bancs."},{name:"Minnow \xE0 bavette 110-130 mm",color:"Dos sombre en eau teint\xE9e",weight:"14-20 g",technique:"R\xE9cup\xE9ration lente en travers du flux sortant, quand l'eau est charg\xE9e et que le souple passe inaper\xE7u."}],access:"Parkings du havre de R\xE9gn\xE9ville. Marche sur banc de sable jusqu'aux postes. Bottes ou waders selon le poste.",securite:[{t:"Ne jamais traverser le havre \xE0 pied seul : travers\xE9e \xE0 mar\xE9e basse et accompagn\xE9e seulement (\xAB trop dangereux seul \xBB).",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"},{t:"Ne jamais traverser le chenal, m\xEAme \xE0 basse mer apparente : les bancs sont mobiles et le flot reprend par l'arri\xE8re. Rep\xE9rer un point de repli visible.",s:"fiche du spot (conseil)"}]},{id:"gouville",tidePort:"gouville",isLocal:!0,zone:"local",dangerLevel:2,name:"Gouville-sur-Mer",subtitle:"Secteur du S\xE9n\xE9quet, parcs et estran",distance:"20 min",distMin:20,coords:"49\xB005'N 1\xB036'W",type:"PARCS + ESTRAN ROCHEUX",color:"#4ade80",terrain:{fond:"Estran mixte : sable, roches affleurantes, parcs ostr\xE9icoles \xE9tendus, plateau du S\xE9n\xE9quet.",encombrement:2,gratter:"texan",couches:["surface","sous-surface","mi-eau","fond"],montage:"Weightless entre les tables ; t\xEAte plomb\xE9e seulement sur le plateau, \xE0 mi-mar\xE9e, avec prudence.",conseils:["La zone des parcs interdit le plomb\xE9 : on y p\xEAche en surface ou juste dessous."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"ZNIEFF marine \xAB Estran rocheux de Gouville \xE0 Agon-Coutainville \xBB : \xAB vaste estran rocheux et sableux \xBB de 3 866 ha, du phare du S\xE9n\xE9quet \xE0 la tour du Ronquet.",s:"INPN \u2014 ZNIEFF 25M000020"},{t:"On y trouve des herbiers de zost\xE8res (Zostera marina et noltei), des r\xE9cifs d'hermelles temporaires et des platiers \xE0 algues rouges ; granulom\xE9trie de la vase aux blocs.",s:"INPN \u2014 ZNIEFF 25M000020"}]},coefBand:[50,70,90,110],coefMin:70,coefIdeal:90,coefMax:110,houleMax:1.8,exposedAngles:[247.5,270,292.5],shelteredAngles:[67.5,90],weatherNote:"Exposition ouest franche. Les parcs cassent partiellement le clapot par vent mod\xE9r\xE9.",sources:["inpn.mnhn.fr \u2014 ZNIEFF marine 25M000020 Estran rocheux de Gouville \xE0 Agon-Coutainville","sylco-peche-brehal.fr \u2014 'Le S\xE9n\xE9quet \xE0 Gouville-sur-Mer' cit\xE9 comme tr\xE8s appr\xE9ci\xE9 des p\xEAcheurs locaux, au m\xEAme titre que le phare du Ronquet","cpiecotentin.com \u2014 estrans rocheux d\xE9couvrant \xE0 mar\xE9e basse sur ce lin\xE9aire","peche.com \u2014 principes des plateaux rocheux et du flot sur estran"],topology:{fond:{text:"Estran mixte : sable, zones rocheuses affleurantes, parcs ostr\xE9icoles \xE9tendus. Le plateau du S\xE9n\xE9quet d\xE9couvre largement par fort coefficient.",confidence:"verified"},structure:{text:"Le S\xE9n\xE9quet est un plateau rocheux balis\xE9 au large de Gouville. Les tables ostr\xE9icoles doublent la structure c\xF4t\xE9 terre. Deux types d'abris pour les proies, donc deux lignes de patrouille pour le bar.",confidence:"verified"},exposition:{text:"Ouest franc. Vent d'E/NE terrestre = mer plate et eau claire, exigeant de la discr\xE9tion. Vent d'O = houle courte sur l'estran, souvent favorable jusqu'\xE0 4 Beaufort.",confidence:"local_knowledge"},courant:{text:"Courant parall\xE8le \xE0 la c\xF4te, acc\xE9l\xE9r\xE9 autour du plateau et entre les rang\xE9es de parcs.",confidence:"inference"},bars:{text:"Spot explicitement cit\xE9 comme appr\xE9ci\xE9 des p\xEAcheurs locaux. Le bar longe les rang\xE9es de tables au flot comme il longerait une bordure rocheuse, et chasse sur le plateau \xE0 mi-mar\xE9e.",confidence:"verified"}},tidalRules:{typeHeure:"MONTANT + MI-MAR\xC9E SUR PLATEAU",montantOuDescendant:"Montant dominant pour les parcs et l'estran. Le plateau du S\xE9n\xE9quet se p\xEAche mieux \xE0 mi-mar\xE9e, quand il est recouvert sans \xEAtre trop profond.",description:"Deux r\xE9gimes selon le poste : les parcs se p\xEAchent au flot en suivant l'eau, le plateau se p\xEAche \xE0 mi-mar\xE9e dans les deux sens.",windows:[{id:"go1",label:"Mi-montant \u2192 PM-1h",phase:"pm",offsetBefore:-3.5,offsetAfter:-1,tidePhaseType:"montant",priority:"prime",note:"Parcs recouverts, bars en chasse le long des rang\xE9es. Souple weightless ou t\xEAte plomb\xE9e tr\xE8s l\xE9g\xE8re pour \xE9viter les croches."},{id:"go2",label:"Mi-descendant sur plateau",phase:"pm",offsetBefore:1.5,offsetAfter:3.5,tidePhaseType:"descendant",priority:"prime",note:"Le plateau du S\xE9n\xE9quet se d\xE9couvre progressivement et l'eau se retire des cassures. Shad plomb\xE9 sur les bordures."},{id:"go3",label:"Cr\xE9puscule sur d\xE9but de flot",phase:"bm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"montant",priority:"prime",note:"Cumul lumi\xE8re basse + premiers centim\xE8tres sur l'estran. Fen\xEAtre la plus productive quand elle tombe bien."}],lifeHack:"Les parcs coupent : semelles \xE9paisses obligatoires. Et le flot remonte entre les tables plus vite qu'il n'y para\xEEt \u2014 garder toujours une ligne de retraite d\xE9gag\xE9e."},lures:[{name:"Souple weightless entre les tables",color:"Naturel / Ayu",weight:"7-10 g sans plomb",technique:"Passage \xE0 fleur d'eau au-dessus des structures. La zone encombr\xE9e interdit le plomb\xE9."},{name:"Shad 10-12 cm t\xEAte plomb\xE9e",color:"Naturel / paillettes par grand soleil",weight:"10-18 g",technique:"Prospection du plateau \xE0 mi-mar\xE9e. R\xE9cup\xE9ration lente avec pauses sur les cassures."},{name:"Stickbait 120-140 mm",color:"Ghost / Iwashi",weight:"16-25 g",technique:"Surface au cr\xE9puscule sur les parcs recouverts, quand des chasses marquent."}],access:"Nombreux acc\xE8s plage \xE0 Gouville, parkings des cabines. Marche variable selon le coefficient.",securite:[{t:"Le flot remonte entre les tables plus vite qu'il n'y para\xEEt : garder une ligne de retraite d\xE9gag\xE9e. Parcs coupants : semelles \xE9paisses.",s:"fiche du spot (conseil)"}]},{id:"agon",tidePort:"agon",isLocal:!0,zone:"local",dangerLevel:3,name:"Pointe d'Agon",subtitle:"Banc de sable et confluence du havre",distance:"25 min",distMin:25,coords:"49\xB001'N 1\xB035'W",type:"POINTE SABLEUSE / VEINE",color:"#84cc16",terrain:{fond:"Banc de sable pur et mobile, fosses lat\xE9rales creus\xE9es par le courant.",encombrement:1,gratter:"oui",couches:["surface","sous-surface","mi-eau","fond"],montage:"Long bill minnow en tr\xE8s peu d'eau ; souple lourd en d\xE9rive dans la veine.",conseils:["Ne jamais traverser le havre \xE0 pied seul : la travers\xE9e se fait \xE0 mar\xE9e basse et accompagn\xE9e (Attitude Manche).","Les bancs bougent \xE0 chaque temp\xEAte : relire la pointe \xE0 mar\xE9e basse."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"L'estran rocheux et sableux de la ZNIEFF Gouville\u2013Agon s'\xE9tend jusqu'\xE0 la tour du Ronquet, au large d'Agon-Coutainville.",s:"INPN \u2014 ZNIEFF 25M000020"},{t:"Le havre de la Sienne se traverse \xE0 pied \xE0 mar\xE9e basse seulement, accompagn\xE9 : \xAB trop dangereux seul \xBB.",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"}]},coefBand:[50,70,90,110],coefMin:70,coefIdeal:90,coefMax:110,houleMax:1.7,exposedAngles:[247.5,270,292.5],shelteredAngles:[90,112.5],weatherNote:"Pointe tr\xE8s expos\xE9e \xE0 l'ouest, sans aucun abri. Le vent y est toujours plus fort que sur la plage voisine.",sources:["inpn.mnhn.fr \u2014 ZNIEFF marine 25M000020","cirkwi.com \u2014 Le havre de Sienne (Attitude Manche)","Guide p\xEAche Latitude Manche \u2014 'Sur les bancs de sable de la pointe d'Agon, \xE0 mar\xE9e montante, on peut utiliser des leurres plongeants type long bill minnow ou un buldo pour rechercher les bars pr\xE9sents dans 50 cm d'eau' ; avertissement explicite : 'attention \xE0 ne pas se laisser entourer \xE0 mar\xE9e montante'","sylco-peche-brehal.fr \u2014 le phare du Ronquet en face d'Agon-Coutainville, tr\xE8s appr\xE9ci\xE9 des p\xEAcheurs locaux","cpiecotentin.com \u2014 g\xE9omorphologie des havres et pointes sableuses"],topology:{fond:{text:"Banc de sable pur, mobile, prolongeant la pointe. Fosses lat\xE9rales creus\xE9es par le courant de vidange du havre de la Sienne.",confidence:"verified"},structure:{text:"La pointe s\xE9pare le havre de la mer ouverte et concentre le courant sur son extr\xE9mit\xE9. Configuration de confluence : deux masses d'eau, une veine puissante.",confidence:"local_knowledge"},exposition:{text:"Face ouest, aucune protection. La pointe prend le vent avant tout le reste du secteur.",confidence:"local_knowledge"},courant:{text:"Fort, notamment au jusant quand le havre se vide. La veine contourne la pointe et cr\xE9e un remous exploitable en aval.",confidence:"inference"},bars:{text:"Source Latitude Manche directe : bars pr\xE9sents dans 50 cm d'eau sur les bancs \xE0 mar\xE9e montante, \xE0 rechercher aux leurres plongeants. Poste d'interception classique sur la veine au jusant.",confidence:"verified"}},tidalRules:{typeHeure:"MONTANT SUR BANCS + JUSANT SUR VEINE",montantOuDescendant:"Les deux, mais pas au m\xEAme endroit : le montant se p\xEAche sur les bancs en tr\xE8s peu d'eau, le jusant se p\xEAche dans la veine de vidange.",description:"Spot \xE0 double r\xE9gime. La s\xE9curit\xE9 commande : la pointe s'isole vite et le flot la contourne par l'arri\xE8re.",windows:[{id:"ag1",label:"Montant sur les bancs",phase:"pm",offsetBefore:-4,offsetAfter:-1.5,tidePhaseType:"montant",priority:"prime",note:"Source Latitude Manche : bars dans 50 cm d'eau, leurre plongeant type long bill minnow. Avancer avec l'eau, jamais s'attarder."},{id:"ag2",label:"PM+1h \u2192 PM+3h30 (veine)",phase:"pm",offsetBefore:1,offsetAfter:3.5,tidePhaseType:"descendant",priority:"prime",note:"Vidange du havre contournant la pointe. Souple lourd en d\xE9rive dans la veine, prospection du remous aval."},{id:"ag3",label:"Cr\xE9puscule quel que soit le sens",phase:"bm",offsetBefore:.5,offsetAfter:2,tidePhaseType:"montant",priority:"bon",note:"La lumi\xE8re basse compense un moment de mar\xE9e moyen. Stickbait si la mer le permet."}],lifeHack:"Danger r\xE9el d'encerclement, signal\xE9 noir sur blanc par le guide d\xE9partemental. Fixer une heure de repli AVANT de partir et s'y tenir, m\xEAme si \xE7a mord."},lures:[{name:"Long bill minnow / leurre plongeant",color:"Naturel argent",weight:"14-22 g",technique:"Source Latitude Manche directe : prospection des bancs en tr\xE8s peu d'eau \xE0 mar\xE9e montante."},{name:"Souple lourd en d\xE9rive",color:"Blanc / naturel",weight:"14-25 g",technique:"Dans la veine de vidange au jusant. Le plombage se r\xE8gle sur le courant."},{name:"Stickbait 125-140 mm",color:"Ghost / blanc en basse lumi\xE8re",weight:"16-25 g",technique:"Surface au cr\xE9puscule quand la mer est maniable."}],access:"Parking d'Agon-Coutainville puis longue marche sur la pointe. Compter le trajet retour dans le calcul de mar\xE9e.",securite:[{t:"Mar\xE9e montante sur les bancs : attention \xE0 ne pas se laisser entourer.",s:"Latitude Manche, guide de p\xEAche",when:{phase:"montant"}},{t:"La pointe s'isole vite et le flot la contourne par l'arri\xE8re.",s:"fiche du spot"},{t:"Ne jamais traverser le havre \xE0 pied seul (\xAB trop dangereux seul \xBB).",s:"Attitude Manche via Cirkwi \u2014 Le havre de Sienne"}]},{id:"portbail",tidePort:"portbail",isLocal:!1,zone:"inter",dangerLevel:2,name:"Portbail",subtitle:"Havre, chenal et platier rocheux",distance:"35 min",distMin:35,coords:"49\xB020'N 1\xB043'W",type:"HAVRE + PLATIER",color:"#38bdf8",terrain:{fond:"Chenal sableux \xE9troit bord\xE9 de platiers rocheux.",e dant dominant sur le chenal. Le platier se p\xEAche \xE0 mi-mar\xE9e dans les deux sens.",description:"M\xEAme logique que R\xE9gn\xE9ville, \xE0 \xE9chelle plus r\xE9duite et plus lisible. Bon spot de repli quand l'ouest souffle trop pour les pointes.",windows:[{id:"po1",label:"PM+1h \u2192 PM+4h30",phase:"pm",offsetBefore:1,offsetAfter:4.5,tidePhaseType:"descendant",priority:"prime",note:"Vidange du havre par le chenal. D\xE9rive de souple, contact permanent."},{id:"po2",label:"Mi-mar\xE9e sur platier",phase:"pm",offsetBefore:-2.5,offsetAfter:-.5,tidePhaseType:"montant",priority:"bon",note:"Platier recouvert de peu d'eau, bars en chasse sur les cassures. Souple l\xE9ger ou minnow."},{id:"po3",label:"\xC9tale de BM",phase:"bm",offsetBefore:-.5,offsetAfter:1.5,tidePhaseType:"montant",priority:"bon",note:"Le chenal concentre m\xE9caniquement le poisson quand le reste est \xE0 d\xE9couvert."}],lifeHack:"Rep\xE9rer le platier \xE0 basse mer par grand coefficient : les cassures et cuvettes qu'on y voit sont exactement les postes qu'on p\xEAchera \xE0 mi-mar\xE9e."},lures:[{name:"Shad souple t\xEAte plomb\xE9e",color:"Naturel / blanc",weight:"12-20 g",technique:"D\xE9rive dans le chenal, plombage r\xE9gl\xE9 sur le courant."},{name:"Black Minnow 120",color:"Kaki / Ayu",weight:"t\xEAte 12-18 g",technique:"R\xE9f\xE9rence Cotentin du bord. Texan limitant les croches sur platier."},{name:"Minnow \xE0 bavette",color:"Naturel / dos sombre",weight:"14-20 g",technique:"Sur le platier recouvert, r\xE9cup\xE9ration lente."}],access:"Parkings du havre et du bourg. Berges praticables, platier accessible \xE0 basse mer.",securite:[{t:"Platier accessible \xE0 basse mer seulement : surveiller la mont\xE9e depuis le platier.",s:"fiche du spot (acc\xE8s)"}]},{id:"carteret",tidePort:"carteret",isLocal:!1,zone:"inter",dangerLevel:3,name:"Cap de Carteret",subtitle:"Cap rocheux, phare, tombant",distance:"40 min",distMin:40,coords:"49\xB022'N 1\xB048'W",type:"CAP ROCHEUX",color:"#0ea5e9",ter erpr\xE9tation de p\xEAche.

M\xE9thode, photo par photo :
1. Dis ce que montre la photo (angle de vue, distance, partie du site) et sa qualit\xE9.
2. Balaie l'image dans l'ordre : premier plan, plan moyen, arri\xE8re-plan ; de gauche \xE0 droite.
3. Rel\xE8ve ce qui est visible parmi : l'\xE9tat de la surface (lisse, rid\xE9e, clapot, vagues, d\xE9ferlement, \xE9cume, lignes ou veines, remous, plaques lisses dans une zone rid\xE9e) ; la couleur et la transparence de l'eau et leurs contrastes ; la roche (platier, blocs, failles, tombant, galets) ; le sable ou la vase ; la v\xE9g\xE9tation (algues, go\xE9mon, herbier) ; l'estran d\xE9couvert ; les ouvrages (cale, digue, \xE9pi, bouchots, tables \xE0 hu\xEEtres, corps-morts, bou\xE9es) ; les acc\xE8s et les dangers visibles ; la vie visible (oiseaux qui plongent ou tournent, \xE9claboussures, poissons) ; le ciel et la lumi\xE8re.

R\xE8gles strictes :
- Une observation = un seul fait visible, situ\xE9 : num\xE9ro de photo et zone de l'image (\xAB premier plan gauche \xBB, \xAB centre, plan moyen \xBB\u2026), plus x et y, la position approximative de son centre en pourcentage de la photo (x : 0 au bord gauche, 100 au bord droit ; y : 0 en haut, 100 en bas).
- Aucun mot d'interpr\xE9tation de p\xEAche (poste, bar, chasse probable, bon coin\u2026) : seulement ce qui se voit.
- Aucune mesure invent\xE9e : pas de profondeur, de vitesse de courant, de hauteur ni de distance chiffr\xE9es. Les comparaisons sont permises (\xAB plus fonc\xE9 que \xBB, \xAB plus large que \xBB).
- Si un \xE9l\xE9ment est ambigu, dis-le et mets la confiance \xE0 \xAB faible \xBB ; ne le compl\xE8te jamais avec ce qui serait probable.
- Ne nomme pas le lieu, sauf s'il est \xE9crit sur la photo.
- Ignore les personnes : ne les d\xE9cris pas et ne cherche pas \xE0 les identifier.
- Dans \xAB non_visible \xBB, liste ce que ces photos ne permettent pas de savoir et qui compterait pour un p\xEAcheur (profondeur, nature du fond sous l'eau, courant hors de la surface visible, ce qui est hors cadre\u2026).
- R\xE9ponds en fran\xE7ais.`,x2=`Tu es un contr\xF4leur exigeant. On te donne des photos et une liste d'observations faites par quelqu'un d'autre.
Pour chaque observation, regarde la photo et la zone indiqu\xE9es, et d\xE9cide :
- \xAB confirme \xBB : le fait est nettement visible \xE0 cet endroit ;
- \xAB douteux \xBB : c'est possible mais ambigu, flou, ou visible ailleurs que dans la zone et la position indiqu\xE9es ;
- \xAB absent \xBB : tu ne le vois pas, ou la photo le contredit.
Sois strict : entre \xAB confirme \xBB et \xAB douteux \xBB, choisis \xAB douteux \xBB. Une mesure chiffr\xE9e ou une interpr\xE9tation pr\xE9sent\xE9e comme un fait visible est \xAB absent \xBB.
Juge seulement ce qui est visible ; n'ajoute aucune observation. Donne pour chaque verdict une raison courte, en fran\xE7ais. Rends exactement un verdict par identifiant re\xE7u.`,b2=`Tu es un p\xEAcheur professionnel du bar au leurre, du bord, sur les c\xF4tes de Bretagne et de Normandie. Tu lis un spot \xE0 partir de FAITS num\xE9rot\xE9s, et de rien d'autre :
- o\u2026 : observations des photos, v\xE9rifi\xE9es (\xAB incertain \xBB quand la v\xE9rification les a jug\xE9es douteuses) ;
- t\u2026 : mar\xE9e et lumi\xE8re au moment des photos, calcul\xE9es par l'application ;
- f\u2026 : fiche du spot dans le guide ;
- u\u2026 : ce que dit le p\xEAcheur.

M\xE9thode : 1. lecture de l'eau et du courant ; 2. structures et fond ; 3. o\xF9 le bar a des raisons de se tenir, et pourquoi (postes) ; 4. moment de mar\xE9e et de lumi\xE8re, seulement si des faits t ou f le permettent ; 5. approche et placement du p\xEAcheur ; 6. s\xE9curit\xE9 ; 7. risque d'accroche ; 8. familles de leurres adapt\xE9es aux couches d'eau et au fond ; 9. confrontation avec la fiche (seulement si des faits f existent) ; 10. ce qu'il faut v\xE9rifier sur place.

R\xE8gles strictes :
- Chaque \xE9l\xE9ment cite dans \xAB refs \xBB les identifiants exacts des faits qui le fondent. Un \xE9l\xE9ment qu'aucun fait ne fonde ne doit pas \xEAtre \xE9crit.
