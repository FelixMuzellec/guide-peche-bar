# À chaque dépôt de fichiers : reconstruit le site depuis src/ et rejoue tous
# les tests (moteur, fiches des spots, parcours complet dans Chromium).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run -s build
      - name: Les fichiers du site correspondent-ils aux sources ?
        run: git diff --stat --exit-code -- index.html logonna.html pirou.html sw.js logonna-manifest.json pirou-manifest.json || echo "::warning::Les fichiers du site ne sont pas à jour avec src/ — dépose les fichiers construits."
      - run: npm run -s test:unit
      - run: npm run -s test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-e2e
          path: tests/shots/
