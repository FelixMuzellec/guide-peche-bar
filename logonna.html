,7,8,9,10,11,12],weight:2,size:"5-10 cm",guidance:"Proie de fond permanente. Dark Sleeper ou souple plomb\xE9 gratt\xE9 sur les fonds durs et les cassures."},{name:"Crabe mou (p\xE9riode de mue)",couche:"fond",months:[5,6,7,8,9],weight:3,size:"3-6 cm",guidance:"Le bar en raffole pendant la mue. Souple compact anim\xE9 tr\xE8s lentement au ras du fond, sur les zones de go\xE9mon et de roche."},{name:"Sprat",couche:"mi-eau",months:[10,11,12,1,2,3],weight:4,size:"8-12 cm",guidance:"Bancs hivernaux. Shad de 10 cm plomb\xE9 de 12 \xE0 25 g selon profondeur et courant. Suivre les oiseaux."},{name:"Civelle et petite anguille",couche:"fond",months:[2,3,4,5],weight:3,size:"6-12 cm",guidance:"Sp\xE9cifique aux estuaires de l'Aulne et de l'\xC9lorn au printemps. Souple tr\xE8s fin, animation lente et rasante."}],seedJournal:[{id:"log-2025-12-27-moulinmer",date:"2025-12-27",spotId:"moulinmer",fish:2,result:7,moment:"coucher",lure:"Asturie 130 blanc \xB7 Asturie 110 Cabot",note:"2 bars avant le coucher du soleil. Aucune chasse en surface."},{id:"log-2026-08-07-moulinmer",date:"2026-08-07",spotId:"moulinmer",fish:0,result:1,lure:"Asturie et Z-Claw, nombreux mod\xE8les essay\xE9s",note:"Bredouille malgr\xE9 une prospection large de la bo\xEEte."},{id:"log-2026-08-08-moulinmer",date:"2026-08-08",spotId:"moulinmer",fish:1,result:5,moment:"coucher",lure:"Z-Claw blanc nacr\xE9",note:"1 bar au moment du coucher du soleil. Aucune chasse en surface."}],tide:{defaultPort:"brest",ports:{brest:{label:"Brest",kind:"harmonic",station:"brest",z0:4.13,lagH:0,accuracy:"contr\xF4l\xE9e contre les tables SHOM : \xB13,9 min \xB7 \xB14 cm (5 mois de contr\xF4le)"}}},sstTypical:[9,18.5]},ff={title:"Principes g\xE9n\xE9raux de la p\xEAche au bar du bord",items:[{rule:"Les 3 premi\xE8res heures de montante ou de descendante sont les plus productives",source:"peche.com / Delalande P\xEAche",explain:"L'activit\xE9 des bars culmine sur ces tranches, quand le courant charrie la nourriture. Les \xE9tales (bas/haut) sont moins productives, sauf sur les spots \xE0 fort courant (Goulet)."},{rule:"Lever et coucher du soleil = fen\xEAtres cl\xE9s",source:"peche.com, fiiish.com",explain:"\xC9clairage faible = bars moins m\xE9fiants, actifs pr\xE8s du bord. Cumuler cr\xE9puscule + mar\xE9e favorable = session optimale. Particuli\xE8rement vrai en rade de Brest o\xF9 l'eau est souvent tr\xE8s claire."},{rule:"Ciel couvert > ciel clair",source:"fiiish.com / peche.com",explain:"Les journ\xE9es l\xE9g\xE8rement couvertes surpassent les plein soleil. Par soleil, pr\xE9f\xE9rer les coups du matin et du soir."},{rule:"Eaux claires de la rade = mat\xE9riel l\xE9ger et discr\xE9tion",source:"peche.com (Nicolas/brestfishing) / Relec29-Desperadiens",explain:"La rade de Brest est une mer int\xE9rieure bien abrit\xE9e, eau claire. Canne 5-15g, tresse PE0.6-0.8, fluoro 25-30/100, leurres petits/discrets. Approche silencieuse \u2014 souvent p\xEAche \xE0 vue en bordure."},{rule:"Coefficient : pas de r\xE8gle unique en rade, le poste d\xE9cide",source:"peche-poissons.com \u2014 \xAB Escapade en rade de Brest, autour de Land\xE9vennec \xBB (julien, 30/03/2022 ; photos Thierry Sauvin)",explain:"La rade n'a pas les courants du Cotentin, sauf au Goulet et aux pointes (Armorique, Espagnols). Le m\xEAme article donne deux r\xE9glages oppos\xE9s : l'\xEEle de T\xE9r\xE9nez \xAB surtout p\xEAchant par faible coefficient (40 \xE0 55) \xBB, le sillon du Pal d\xE8s que le coefficient atteint 90. Chaque fiche porte donc sa propre plage."}]},qe=[{id:"moulinmer",zone:"local",isLocal:!0,dangerLevel:1,name:"Moulin Mer",subtitle:"Anse de Moulin-Mer, Logonna-Daoulas",distance:"5 min",distMin:5,coords:"48\xB019'N 4\xB017'W",lat:48.3159,lon:-4.2862,type:"BORDURES GO\xC9MON",color:"#22c55e",terrain:{fond:"Roches et go\xE9mon sur toutes les bordures ; sable-vase seulement au c\u0153ur de l'anse.",encombrement:3,gratter:"non",couches:["surface","sous-surface"],montage:"Weightless ou texan (hame\xE7on texan 3/0 \xE0 4/0). Pas de t\xEAte plomb\xE9e nue : elle finit dans les rochers.",conseils:["Lancer parall\xE8le aux bordures et faire nager le leurre au-dessus du go\xE9mon, jamais dedans.","Respecter les parcs \xE0 hu\xEEtres (concessions de Moulin-Mer \xE0 Kervella) : ne pas les traverser ni lancer dedans.","\xC0 mar\xE9e basse, rep\xE9rer les couloirs de sable entre les rochers : c'est par l\xE0 que le bar entre au flot.","Quand la pression pousse le poisson vers le fond, rester au ras du go\xE9mon avec un leurre lent plut\xF4t que gratter."],confidence:"local_knowledge",source:"F\xE9lix, p\xEAche sur place (10/10/2026) ; Desperadiens/Relec29 pour le weightless sur go\xE9mon",faits:[{t:"Moulin-Mer est sur la rive SUD de la presqu'\xEEle de Logonna, \xE0 l'embouchure de la rivi\xE8re de l'H\xF4pital (ria du Camfrout).",s:"Wikip\xE9dia \u2014 Logonna-Daoulas (g\xE9ographie)"},{t:"Concessions ostr\xE9icoles \xAB de Moulin-Mer \xE0 Kervella au sud \xBB.",s:"Wikip\xE9dia \u2014 Logonna-Daoulas (g\xE9ographie)"},{t:"Le terre-plein du centre nautique a \xE9t\xE9 construit avec les d\xE9blais des carri\xE8res de kersanton voisines.",s:"Wikip\xE9dia \u2014 Logonna-Daoulas (g\xE9ographie)"},{t:"Le moulin \xE0 mar\xE9e est \xAB \xE0 l'abri des vagues de la rade \xBB.",s:"Office de tourisme Landerneau-Daoulas"},{t:"Cale \xE9troite et en virage, utilisable \xE0 mi-mar\xE9e.",s:"Voile-Aviron, livret \xAB 50 sites de la rade de Brest \xBB"}]},coefBand:[25,40,80,105],coefMin:40,coefIdeal:80,coefMax:105,houleMax:1.2,exposedAngles:[180,202.5,225],shelteredAngles:[0,22.5,337.5],weatherNote:"Rive sud de la presqu'\xEEle de Logonna, \xE0 l'embouchure de la rivi\xE8re de l'H\xF4pital-Camfrout (Wikip\xE9dia). La presqu'\xEEle abrite des vents de nord ; c'est le secteur sud-ouest qui l\xE8ve un clapot dans l'anse. Orientation \xE0 confirmer sur place.",sources:["fr.wikipedia.org \u2014 Logonna-Daoulas (g\xE9ographie : Moulin-Mer, rive sud, embouchure de la rivi\xE8re de l'H\xF4pital)","tourisme-landerneau-daoulas.fr \u2014 sentier littoral de Logonna et escapade en rade","voileaviron.org \u2014 livret des sites de la rade de Brest","Desperadiens \u2014 'P\xEAche aux leurres de surface par Relec29' (mentionne explicitement les bordures de Moulin Mer comme spot r\xE9f\xE9rence LS en go\xE9mon)","peche.com \u2014 La rade de Brest, terrain de jeu (Nicolas / brestfishing.fr)","capitaine-spots.fr \u2014 Pointe de Bindy (secteur voisin)"],topology:{fond:{text:"Bordures rocheuses avec tapis de go\xE9mons/fucus, sable-vase dans l'anse. Hauts-fonds qui s'\xE9tendent loin \xE0 BM.",confidence:"local_knowledge"},structure:{text:"Source Desperadiens/Relec29 : 'les bordures de moulin mer en Logonna Daoulas' figurent parmi les zones encombr\xE9es typiques o\xF9 le leurre souple en surface (weightless) sur go\xE9mon donne de beaux bars. Ancien moulin \xE0 mar\xE9e, petit \xE9tier, pointe rocheuse plongeante.",confidence:"verified"},exposition:{text:"Rive sud de la presqu'\xEEle, ouverte sur la ria du Camfrout (Wikip\xE9dia). Abrit\xE9e des vents de N \xE0 NE par la presqu'\xEEle ; expos\xE9e au S-SO. La version d'origine la disait \xAB orient\xE9e NO \xBB : contredit par la g\xE9ographie, \xE0 confirmer sur place.",confidence:"inference"},courant:{text:"Courant faible \xE0 mod\xE9r\xE9, acc\xE9l\xE9ration l\xE9g\xE8re autour de la pointe. La rade de Brest a des courants globaux de 0.5 \xE0 3 nds (source navigation-croisiere), Logonna est dans la tranche basse.",confidence:"verified"},bars:{text:"Bars de bordure, souvent en petit groupe, chassent crevettes/lan\xE7ons dans le go\xE9mon. Sp\xE9cimens 40-55cm r\xE9guliers, pi\xE8ces 70+ document\xE9es dans le secteur (Relec29 sur le Relecq voisin).",confidence:"verified"}},tidalRules:{typeHeure:"MONTANT PLEIN + CR\xC9PUSCULES",montantOuDescendant:"Montant dominant pour les bordures de go\xE9mon (le flot noie les tapis et active les bars). Le descendant peut marcher c\xF4t\xE9 pointe avec courant l\xE9ger. \xC9tales peu productives sauf en p\xEAche \xE0 vue.",description:"Bordure classique : on p\xEAche le flot quand les go\xE9mons sont recouverts (bars post\xE9s dedans) et le d\xE9but de descendant quand les proies quittent les herbiers. P\xEAche \xE0 vue possible par eau claire et temps calme.",windows:[{id:"mm1",label:"2e moiti\xE9 de montant",phase:"pm",offsetBefore:-3,offsetAfter:-.5,tidePhaseType:"montant",priority:"prime",note:"Les tapis de go\xE9mons sont recouverts, bars en chasse dans les bordures. Lancer parall\xE8le \xE0 la c\xF4te, leurre souple weightless type Gambit 120mm."},{id:"mm2",label:"D\xE9but de descendant",phase:"pm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"descendant",priority:"prime",note:"Eau qui se retire des go\xE9mons, proies expos\xE9es. M\xEAme approche, possible switch stickbait/pencil surface si chasses visibles."},{id:"mm3",label:"Cr\xE9puscule BM montante",phase:"bm",offsetBefore:-.5,offsetAfter:2,tidePhaseType:"montant",priority:"prime",note:"Cumul cr\xE9puscule + d\xE9but de flot = fen\xEAtre la plus productive de la rade selon Desperadiens. Jerkbait ou stickbait sur chasses."}],lifeHack:"Approche silencieuse obligatoire \u2014 p\xEAche souvent \xE0 vue. Leurre souple weightless dans les go\xE9mons (co\xFBt faible = on les envoie o\xF9 on ne lance pas un stickbait \xE0 30\u20AC). Canne courte 2m/2.10 selon Relec29, puissance 5-15g, tresse PE0.6-0.8, fluoro 28-30/100."},lures:[{name:"Leurre souple weightless dans go\xE9mon",color:"Ayu / Motor Oil / Natural",weight:"7-10g mont\xE9 sans plomb ou t\xEAte 3-5g",technique:"Source Desperadiens directe : Gambit method shad d'Illex ou \xE9quivalent 12cm, weightless, promen\xE9 \xE0 fleur d'eau sur le go\xE9mon. L'arme absolue de Moulin Mer."},{name:"Stickbait / pencil 110-130mm",color:"Ghost / Sardine / Iwashi",weight:"14-22g",technique:"Walk-the-dog en surface au cr\xE9puscule sur montante. Asturie 110 ou Patchinko 125 en r\xE9f\xE9rence perso."},{name:"Jerkbait suspending 110mm",color:"Ayu / Mullet",weight:"12-16g",technique:"Sur les zones moins encombr\xE9es c\xF4t\xE9 pointe. Twitch lent, pauses longues."}],access:"Depuis Logonna-Daoulas bourg, direction Moulin Mer/Pointe du Ch\xE2teau. Parking devant le centre nautique. Acc\xE8s direct aux bordures rocheuses \xE0 pied. Bottes suffisent, semelles crant\xE9es utiles sur go\xE9mon humide.",securite:[{t:"Go\xE9mon humide glissant : semelles crant\xE9es.",s:"fiche du spot (acc\xE8s)"}]},{id:"bendy",zone:"local",isLocal:!0,dangerLevel:1,name:"Pointe du Bendy",subtitle:"Anse du Bendy, Logonna-Daoulas",riviere:"rivi\xE8re de Daoulas",distance:"10 min",distMin:10,coords:"48\xB019'N 4\xB019'W",type:"POINTE ROCHEUSE",color:"#4ade80",terrain:{fond:"Alternance de roche et de sable, platiers d\xE9couvrants, herbiers de zost\xE8res en bordure.",encombrement:2,gratter:"texan",couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte weedless ou texan sur les platiers ; t\xEAte plomb\xE9e classique seulement sur le sable.",conseils:["Rep\xE9rer \xE0 mar\xE9e basse les plaques de sable entre les platiers : ce sont les seules zones o\xF9 gratter.","Passer au-dessus des zost\xE8res : un souple qui s'y accroche ne p\xEAche plus."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"La pointe du Bendy est l'extr\xE9mit\xE9 ouest de la presqu'\xEEle de Logonna.",s:"Wikip\xE9dia \u2014 Logonna-Daoulas (g\xE9ographie)"},{t:"Sillon en tombolo, doubl\xE9 d'un second cordon qui forme un bassin abrit\xE9.",s:"Voile-Aviron, livret \xAB 50 sites de la rade de Brest \xBB"},{t:"Roche de La Co\xEBt, non balis\xE9e, \xE0 contourner au large.",s:"Voile-Aviron, livret \xAB 50 sites de la rade de Brest \xBB"}]},coefBand:[30,50,85,108],coefMin:50,coefIdeal:85,coefMax:108,houleMax:1.3,exposedAngles:[270,292.5,315],shelteredAngles:[90,112.5,67.5],weatherNote:"Pointe orient\xE9e \xE0 l'ouest sur la rivi\xE8re de Daoulas. Expos\xE9e aux vents d'O/NO, bien abrit\xE9e E/NE.",sources:["fr.wikipedia.org \u2014 Logonna-Daoulas","voileaviron.org \u2014 livret des sites de la rade de Brest","capitaine-spots.fr \u2014 'Pointe de Bindy/Bendy \xE0 Logonna-Daoulas : spot de p\xEAche r\xE9put\xE9 avec vue sur la rade de Brest'","tourisme-landerneau-daoulas.fr \u2014 Pointe du Bendy parmi les spots estran de Logonna (Le Roz, Le Yelen, Le Bendy, Porsisquin)","peche.com \u2014 Principes g\xE9n\xE9raux pointes rocheuses"],topology:{fond:{text:"Alternance roche-sable, platiers d\xE9couvrant sur coef > 70, herbiers de zost\xE8res en bordures. Spot d'estran riche (palourdes, bigorneaux, crevettes) donc garde-manger pour le bar.",confidence:"verified"},structure:{text:"Pointe \xE0 l'entr\xE9e de l'anse du Bendy, sur la rive sud de la rivi\xE8re de Daoulas. Configuration classique de pointe rade : l\xE9g\xE8re acc\xE9l\xE9ration du courant au tombant, tourbillon aval selon sens de mar\xE9e. Vue d\xE9gag\xE9e sur l'entr\xE9e de la rade vers l'Armorique.",confidence:"local_knowledge"},exposition:{text:"Face NO/O. Vent de NE/E arrive sur l'arri\xE8re des terres = bien abrit\xE9. Vent O/NO l\xE8ve une mer courte mais la rade reste ferm\xE9e (pas de houle oc\xE9anique).",confidence:"local_knowledge"},courant:{text:"Mod\xE9r\xE9. Courant de l'anse du Bendy + courant g\xE9n\xE9ral rade. Plus marqu\xE9 en vive-eau, quasi nul en morte-eau.",confidence:"inference"},bars:{text:"Spot explicitement qualifi\xE9 de 'p\xEAche r\xE9put\xE9e' par capitaine-spots.fr. Zone d'estran riche = nourriture abondante. Bars de passage sur le montant, post\xE9s sur le descendant derri\xE8re la pointe.",confidence:"verified"}},tidalRules:{typeHeure:"FLOT \xC9TABLI + 1h APR\xC8S PM",montantOuDescendant:"Les deux fonctionnent. Montante : bars qui remontent avec le flot, en chasse sur les platiers. Descendant : postage sur tombant aval de la pointe.",description:"Pointe de rade classique. \xC0 mi-mar\xE9e + ou -, les platiers sont accessibles et on peut lancer loin. \xC0 BM les platiers sont \xE0 d\xE9couvert, inaccessibles.",windows:[{id:"b1",label:"Fin de montant \u2192 1h apr\xE8s PM",phase:"pm",offsetBefore:-2,offsetAfter:1,tidePhaseType:"montant",priority:"prime",note:"Fen\xEAtre large : flot terminal + \xE9tale PM + tout d\xE9but de descendant. Les bars sont en chasse sur les platiers qui viennent d'\xEAtre recouverts."},{id:"b2",label:"1-2h apr\xE8s PM (descendant)",phase:"pm",offsetBefore:1,offsetAfter:2.5,tidePhaseType:"descendant",priority:"bon",note:"Postage sur le tombant aval de la pointe. Leurre coulant dans le courant descendant."},{id:"b3",label:"D\xE9but de montant (cr\xE9puscule)",phase:"bm",offsetBefore:1,offsetAfter:3,tidePhaseType:"montant",priority:"bon",note:"Si PM en fin de journ\xE9e \u2192 coup du soir optimal. Stickbait sur chasses."}],lifeHack:"Rep\xE9rer \xE0 BM les chenaux entre les platiers \u2014 ce sont les veines que les bars empruntent sur le flot. Possibilit\xE9 de p\xEAche \xE0 vue en \xE9t\xE9 par eau tr\xE8s claire et soleil bas."},lures:[{name:"Shad souple 10-14cm t\xEAte plomb\xE9e",color:"Natural / Smoke / Chartreuse",weight:"10-18g",technique:"Prospection large sur platiers recouverts. R\xE9cup\xE9 lente avec pauses."},{name:"Stickbait / pencil bait",color:"Ghost / Sardine",weight:"18-28g",technique:"Walk-the-dog au-dessus des platiers en fin de montant si mer calme."},{name:"Jerkbait suspending",color:"Ayu / Mullet",weight:"12-16g",technique:"Twitchs courts entre les blocs rocheux c\xF4t\xE9 pointe."}],access:"Depuis Logonna-Daoulas bourg, route vers Pointe du Bendy (fl\xE9ch\xE9). Parking au bout de la route. Acc\xE8s \xE0 pied par sentier c\xF4tier (GR34). P\xEAche depuis les rochers de la pointe ou sur les platiers selon mar\xE9e.",securite:[]},{id:"rostiviec",zone:"local",isLocal:!0,dangerLevel:1,name:"Rostiviec",subtitle:"Port et anse de Penfoul, Loperhet",distance:"15 min",distMin:15,coords:"48\xB020'N 4\xB018'W",type:"RIA / BAIE DE DAOULAS",color:"#34d399",terrain:{fond:"Vase et sablo-vase dans l'anse, cailloutis en bordure, corps-morts et anciens parcs.",encombrement:2,gratter:"texan",couches:["surface","sous-surface","mi-eau","fond"],montage:"Texan obligatoire pr\xE8s des parcs et des corps-morts ; t\xEAte l\xE9g\xE8re possible sur la vase d\xE9gag\xE9e du chenal.",conseils:["Les lignes de corps-morts sont des postes, mais aussi des pi\xE8ges \xE0 leurres : longer, ne pas traverser."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"Le sillon de Rostiviec \xAB a du mal \xE0 \xE9merger \xE0 mar\xE9e haute \xBB ; derri\xE8re, une anse assez abrit\xE9e ; la cale du quai donne sur une gr\xE8ve praticable.",s:"Voile-Aviron, livret \xAB 50 sites de la rade de Brest \xBB"},{t:"L'anse de Penfoul \xAB se vide enti\xE8rement \xE0 mar\xE9e basse \xBB.",s:"Office de tourisme Landerneau-Daoulas"}]},coefBand:[20,35,75,100],coefMin:35,coefIdeal:75,coefMax:100,houleMax:1.2,exposedAngles:[202.5,180,225],shelteredAngles:[0,22.5,337.5],weatherNote:"Port nich\xE9 dans une ria : brise maritime pr\xE9sente mais abri quasi permanent de la houle. Le clapot ne s'y forme que par vent de sud \xE9tabli.",sources:["voileaviron.org \u2014 livret des sites de la rade de Brest","tourisme-landerneau-daoulas.fr \u2014 sentier littoral (anse de Penfoul)","pays-landerneau-daoulas.fr \u2014 Le centre nautique est situ\xE9 sur le littoral de la commune de Loperhet, au port de Rostiviec, nich\xE9 dans une ria de la rade de Brest ; zone de navigation sur la baie de Daoulas (12 km\xB2), abrit\xE9e de la houle","tourisme-landerneau-daoulas.fr \u2014 Loperhet list\xE9 avec ses propres sites (Pors Don, Kersanton), distincts de ceux de L'H\xF4pital-Camfrout","despoissonssigrands.com \u2014 P\xEAche du bar en fond de rade (principes)"],topology:{fond:{text:"Vase et sablo-vase dominants dans l'anse, cailloutis sur les bordures. Parcs et anciennes zones ostr\xE9icoles en pourtour de la baie de Daoulas.",confidence:"inference"},structure:{text:"Ancien village de p\xEAcheurs et port de plaisance install\xE9 dans une ria, sur la baie de Daoulas. L'anse de Penfoul prolonge le site vers l'est. Chenal d'acc\xE8s et zone de mouillages structurent les fonds.",confidence:"verified"},exposition:{text:"Abri remarquable : la ria coupe la houle de rade quelle que soit sa direction. Le site reste ventil\xE9 par la brise thermique, mais la mer y est form\xE9e seulement par vent de S/SO \xE9tabli remontant la baie.",confidence:"verified"},courant:{text:"Courant mod\xE9r\xE9, canalis\xE9 par le chenal d'acc\xE8s et les bordures de mouillages. Nettement plus faible que sur les pointes de la rade \u2014 c'est un poste de finesse, pas de force.",confidence:"inference"},bars:{text:"Bars de bordure patrouillant les mouillages, les coques de bateaux et les bordures vaseuses au flot. Poste de repli par excellence quand tout le reste de la rade est imp\xEAchable.",confidence:"inference"}},tidalRules:{typeHeure:"MONTANT SUR LES BORDURES",montantOuDescendant:"Montant dominant : le flot recouvre les vasi\xE8res et les bars entrent y chasser crevettes et gobies. Le descendant concentre le poisson dans le chenal.",description:"Spot d'abri et de finesse. On y va quand le vent interdit les pointes, et on y p\xEAche l\xE9ger, en p\xEAche \xE0 vue si l'eau est claire.",windows:[{id:"ro1",label:"3 premi\xE8res heures de montant",phase:"bm",offsetBefore:.5,offsetAfter:3,tidePhaseType:"montant",priority:"prime",note:"Le flot recouvre les vasi\xE8res. Longer les bordures et les lignes de mouillages, souple l\xE9ger ou weightless."},{id:"ro2",label:"Fin de montant sur les mouillages",phase:"pm",offsetBefore:-2,offsetAfter:-.5,tidePhaseType:"montant",priority:"bon",note:"Les bars circulent entre les coques. Approche silencieuse, leurre discret."},{id:"ro3",label:"D\xE9but de descendant (chenal)",phase:"pm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"descendant",priority:"bon",note:"L'eau se retire des vasi\xE8res et concentre le poisson dans le chenal. Shad plomb\xE9 l\xE9ger dans la veine."}],lifeHack:"C'est le spot de mauvais temps de la rade : quand l'ouest souffle \xE0 5 Beaufort et que tout est blanc dehors, ici c'est plat. P\xEAcher fin, fluorocarbone 25/100, leurres discrets \u2014 l'eau y est souvent tr\xE8s claire."},lures:[{name:"Souple weightless ou t\xEAte plomb\xE9e l\xE9g\xE8re",color:"Natural / Smoke / Motor Oil",weight:"5-10 g",technique:"Bordures vaseuses et lignes de mouillages. Le poids minimal qui permet encore de lancer."},{name:"Jerkbait suspending 100-110 mm",color:"Ayu / Mullet / Crystal",weight:"12-16 g",technique:"Twitch lent dans les zones d\xE9gag\xE9es du chenal."},{name:"Shad souple 10-12 cm en texan",color:"Natural / blanc",weight:"10-16 g",technique:"Texan indispensable pr\xE8s des parcs et des corps-morts."}],access:"Depuis Logonna : Daoulas puis Loperhet, direction port de Rostiviec. Parking \xE0 la cale, sentier c\xF4tier vers l'anse de Penfoul. Aucune difficult\xE9.",securite:[]},{id:"camfrout",zone:"local",isLocal:!0,dangerLevel:2,name:"L'H\xF4pital-Camfrout",subtitle:"Rivi\xE8re du Camfrout, Tibidy, Troaon",distance:"15 min",distMin:15,coords:"48\xB017'N 4\xB014'W",type:"ESTUAIRE / TOMBOLO",color:"#34d399",terrain:{fond:"Vase-sable dans l'estuaire, roche et cailloux vers Tibidy, parcs \xE0 hu\xEEtres et herbiers en bordure.",encombrement:2,gratter:"texan",couches:["surface","sous-surface","mi-eau","fond"],montage:"Texan anti-accroche sur les parcs et les herbiers ; weightless \xE0 vue dans les bordures peu profondes.",conseils:["C\xF4t\xE9 Tibidy (roche), remonter d'une couche : sous-surface plut\xF4t que fond."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"L'\xEElot de Tibidy est priv\xE9 ; on ne peut aborder que c\xF4t\xE9 est du tombolo.",s:"Voile-Aviron, livret \xAB 50 sites de la rade de Brest \xBB"}]},coefBand:[25,45,85,108],coefMin:45,coefIdeal:85,coefMax:108,houleMax:1.3,exposedAngles:[292.5,315,270],shelteredAngles:[112.5,135,90],weatherNote:"Estuaire encastr\xE9 en fond de rade, abrit\xE9 des vents d'O/SO par la g\xE9ographie. Le vent de NO remonte la ria.",sources:["voileaviron.org \u2014 livret des sites de la rade de Brest (Tibidy priv\xE9)","en.wikipedia.org/wiki/\xCEle_de_Tibidy \u2014 Tibidy est un \xEElot \xE0 l'embouchure de la rivi\xE8re du Faou, en fond de rade de Brest, sur des terres appartenant \xE0 la commune de L'H\xF4pital-Camfrout, reli\xE9 au continent par un cordon littoral","tourisme-landerneau-daoulas.fr \u2014 Sites de L'H\xF4pital-Camfrout : Tibidy, Kerdreolet, Troaon, Kerhasco\xEBt (list\xE9s distinctement de ceux de Loperhet)","tourisme-landerneau-daoulas.fr \u2014 Kerhasco\xEBt, ancien port coquillier de la commune, vue sur la presqu'\xEEle de Logonna","despoissonssigrands.com \u2014 P\xEAche du bar en estuaire (principes)"],topology:{fond:{text:"Vase-sable dans l'estuaire du Camfrout, cailloux et roche vers Tibidy. Parcs \xE0 hu\xEEtres sur les bordures, herbiers de zost\xE8res document\xE9s en fond de rade \u2014 indicateur de richesse biotique.",confidence:"inference"},structure:{text:"Deux structures superpos\xE9es : l'estuaire de la rivi\xE8re du Camfrout, et l'\xEElot de Tibidy reli\xE9 au continent par un cordon littoral, \xE0 l'embouchure de la rivi\xE8re du Faou. Le cordon est une barri\xE8re physique qui d\xE9vie le flux et cr\xE9e un poste d'embuscade franc.",confidence:"verified"},exposition:{text:"Double abri : repli\xE9 au fond de la ria, et Tibidy masque la sortie. Quasi inattaquable par vent d'O/SO. Le NO remonte l'estuaire et rend l'eau moins lisible.",confidence:"inference"},courant:{text:"Chenalisation nette. Courant mod\xE9r\xE9 dans l'estuaire, sensiblement plus marqu\xE9 autour du cordon de Tibidy o\xF9 le flux est resserr\xE9.",confidence:"inference"},bars:{text:"Biotope euryhalin classique du bar en fond de rade : gradient de salinit\xE9, proies concentr\xE9es, bars r\xE9sidents doubl\xE9s de poissons de passage sur le montant.",confidence:"inference"}},tidalRules:{typeHeure:"3 PREMI\xC8RES HEURES DE MONTANT (r\xE8gle estuaire)",montantOuDescendant:"Montant dominant \u2014 les bars entrent avec le flot pour chasser dans le chenal et autour des parcs. Fin de descendant exploitable en postage \xE0 la sortie.",description:"R\xE8gle classique d'estuaire : trois premi\xE8res heures de montant depuis BM+0h30. Les gros bars remontent avec la mar\xE9e puis redescendent avec le jusant.",windows:[{id:"hc1",label:"3 premi\xE8res heures de montant",phase:"bm",offsetBefore:.5,offsetAfter:3,tidePhaseType:"montant",priority:"prime",note:"R\xE8gle la plus universelle en estuaire. Se poster sur les bordures du chenal ou le long du cordon de Tibidy."},{id:"hc2",label:"Fin de descendant (sortie d'estuaire)",phase:"bm",offsetBefore:-2,offsetAfter:-.5,tidePhaseType:"descendant",priority:"bon",note:"Les bars quittent l'estuaire par le resserrement de Tibidy : embuscade en sortie."},{id:"hc3",label:"D\xE9but de descendant (postage chenal)",phase:"pm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"descendant",priority:"bon",note:"Shad plomb\xE9 dans les veines profondes du chenal."}],lifeHack:"Rep\xE9rer les postes \xE0 basse mer : fosses du chenal, bordures herbeuses, parcs \xE0 hu\xEEtres. Fluorocarbone fin (25/100) car l'eau est claire. Texan indispensable pour ne pas s'accrocher dans les parcs. Le cordon de Tibidy se traverse \xE0 pied \xE0 basse mer en vive-eau \u2014 v\xE9rifier l'heure de retour avant de s'engager."},lures:[{name:"Shad souple 10-12 cm en texan",color:"Natural / Smoke / Motor Oil",weight:"10-16 g",technique:"R\xE9f\xE9rence estuaire. Texan anti-accrochage essentiel sur les parcs et les herbiers."},{name:"Jerkbait suspending 100-110 mm",color:"Ayu / Mullet / Crystal",weight:"12-16 g",technique:"Twitch lent dans les zones d\xE9gag\xE9es du chenal."},{name:"Pintail / slug weightless",color:"White UV / Natural",weight:"5-10 g sans plomb",technique:"P\xEAche \xE0 vue dans les bordures peu profondes si eau claire et soleil."}],access:"Depuis Logonna : D770 vers L'H\xF4pital-Camfrout. Parkings du bourg et de Kerhasco\xEBt. Acc\xE8s \xE0 Troaon, Kerdreolet et au cordon de Tibidy (l'\xEElot de Tibidy est priv\xE9 : ne pas y monter). Bottes ou waders selon le poste.",securite:[{t:"L'\xEElot de Tibidy est priv\xE9 : ne pas y monter.",s:"fiche du spot (acc\xE8s)"}]},{id:"lauberlach",zone:"local",isLocal:!0,dangerLevel:1,name:"Sillon de Lauberlac'h",subtitle:"Anse de l'Auberlach, Plougastel-Daoulas",distance:"25 min",distMin:25,coords:"48\xB021'N 4\xB021'W",type:"SILLON / ANSE",color:"#86efac",terrain:{fond:"Sable-vase \xE0 l'int\xE9rieur de l'anse, galets sur le sillon, roche et platiers en bordure.",encombrement:2,gratter:"texan",couches:["surface","sous-surface","mi-eau","fond"],montage:"T\xEAte plomb\xE9e l\xE9g\xE8re au c\u0153ur de l'anse sableuse ; texan d\xE8s qu'on approche des platiers.",conseils:["Le long du sillon c\xF4t\xE9 rade, prospecter en lin\xE9aire lent sans toucher les galets du pied de sillon."],confidence:"inference",source:"D\xE9duit de la description du fond de ce spot",faits:[{t:"La passe du sillon \xAB peut conna\xEEtre un courant assez fort \xBB ; acc\xE8s bateau \xE0 \xB1 1 h de la pleine mer.",s:"Voile-Aviron, livret \xAB 50 sites de la rade de Brest \xBB"},{t:"Plage int\xE9rieure : \xAB le sable le plus accueillant (il peut y avoir quelques cailloux) \xBB.",s:"Voile-Aviron, livret \xAB 50 sites de la rade de Brest \xBB"},{t:"Anse \xAB assez expos\xE9e au S et SW \xBB, \xE0 \xE9viter au mouillage en hiver.",s:"Forum Hisse et Ho \u2014 mouillages en rade de Brest"}]},coefBand:[30,50,88,110],coefMin:50,coefIdeal:88,coefMax:110,houleMax:1.5,exposedAngles:[202.5,180,225],shelteredAngles:[315,337.5,292.5],weatherNote:"Source lordjimcroisieres : 'Anse de l'Auberlach ouverte au Sud-Ouest et bien prot\xE9g\xE9e des vents de Nord-Ouest jusqu'au sud-est.'",sources:["voileaviron.org \u2014 livret des sites de la rade de Brest","hisse-et-oh.com \u2014 forum mouillages en rade de Brest","lordjimcroisieres.com \u2014 Navigation rade de Brest : Anse de l'Auberlach, exposition SO et protection NO\u2192SE","campingsaintjean.com \u2014 Porz Gwenn et Sillon de Lauberlac'h parmi les sites de p\xEAche \xE0 pied/au leurre privil\xE9gi\xE9s","peche.com \u2014 P\xEAche en rade de Brest (Nicolas/brestfishing)"],topology:{fond:{text:"Sillon = fl\xE8che de galets qui ferme partiellement l'anse. Sable-vase \xE0 l'int\xE9rieur, roche et platiers en bordure. Zone riche en coques/palourdes/couteaux (source camping Saint-Jean) = biotope pour le bar.",confidence:"verified"},structure:{text:"Classique 'sillon' breton : cordon littoral parall\xE8le \xE0 la c\xF4te qui cr\xE9e une anse int\xE9rieure prot\xE9g\xE9e. Les bars patrouillent le long du sillon c\xF4t\xE9 rade, et entrent dans l'anse sur le flot. Cale et mouillages dans l'anse.",confidence:"verified"},exposition:{text:"Source directe lordjimcroisieres : ouverte au SO, prot\xE9g\xE9e NO\u2192SE. Spot parfait par vent du secteur N \xE0 E. \xC0 \xE9viter par fort vent SO.",confidence:"verified"},courant:{text:"Courant mod\xE9r\xE9 sur le sillon ext\xE9rieur, tr\xE8s faible dans l'anse. Bascule de courant selon la mar\xE9e qui entre/sort de l'anse.",confidence:"inference"},bars:{text:"Plougastel figure 'parmi les sites les plus privil\xE9gi\xE9s pour la p\xEAche depuis le bord' (camping Saint-Jean). Bars qui longent le sillon c\xF4t\xE9 rade, patrouillent en bordure d'anse sur le montant.",confidence:"verified"}},tidalRules:{typeHeure:"LE LONG DU SILLON SUR MONTANT + ANSE SUR FLOT PLEIN",montantOuDescendant:"Montant dominant : longer le sillon c\xF4t\xE9 ext\xE9rieur (rade) pour chercher les bars de passage, puis passer dans l'anse quand le flot y entre.",description:"Deux approches selon l'heure de mar\xE9e : (1) c\xF4t\xE9 rade du sillon = prospection longue distance sur montant ; (2) \xE0 l'int\xE9rieur de l'anse = p\xEAche fine en bordure quand le flot a rempli.",windows:[{id:"la1",label:"Montant plein (flot \xE9tabli)",phase:"bm",offsetBefore:1.5,offsetAfter:4.5,tidePhaseType:"montant",priority:"prime",note:"Longer le sillon c\xF4t\xE9 rade, lancer parall\xE8le \xE0 la c\xF4te. Les bars remontent le long du cordon."},{id:"la2",label:"\xC9tale PM + d\xE9but descendant (dans l'anse)",phase:"pm",offsetBefore:-.5,offsetAfter:1.5,tidePhaseType:"renversement",priority:"prime",note:"Anse pleine, eau calme, bars en chasse fine sur les bordures. P\xEAche \xE0 vue ou LS weightless."},{id:"la3",label:"Cr\xE9puscule",phase:"pm",offsetBefore:-1,offsetAfter:2,tidePhaseType:"variable",priority:"bon",note:"Coup du soir universellement favorable, \xE0 cumuler avec une des deux fen\xEAtres ci-dessus."}],lifeHack:"Rep\xE9rer \xE0 BM les veines et les go\xE9mons. Le changement de c\xF4t\xE9 (ext\xE9rieur sillon \u2192 int\xE9rieur anse) suit la mar\xE9e. Refuge par vent de secteur N quand les autres spots locaux sont moins confortables."},lures:[{name:"Shad 10-14cm t\xEAte plomb\xE9e",color:"Natural / Smoke / Ayu",weight:"10-18g",technique:"Prospection longue le long du sillon c\xF4t\xE9 rade."},{name:"Stickbait 110-130mm",color:"Ghost / Sardine",weight:"18-28g",technique:"Surface au-dessus du sillon et en entr\xE9e d'anse sur montante."},{name:"LS weightless (pintail, slug)",color:"White / Natural / UV",weight:"5-10g sans plomb",technique:"P\xEAche fine dans l'anse \xE0 eau calme, \xE0 vue si possible. Approche silencieuse."}],access:"D770 puis direction Lauberlac'h / Plougastel-Daoulas sud. Parking \xE0 la cale de l'anse. Sentier c\xF4tier (GR34) longe le sillon \u2014 acc\xE8s direct aux deux c\xF4t\xE9s. Pas de difficult\xE9 technique.",securite:[]},{id:"armorique",zone:"inter",isLocal:!1,dangerLevel:1,name:"Pointe de l'Armorique",subtitle:"Plougastel-Daoulas nord",distance:"30 min",distMin:30,coords:"48\xB021'N 4\xB025'W",type:"POINTE RADE",color:"#14b8a6",terrain:{fond:"Roche et platiers, tombant plus marqu\xE9 qu'en fond de rade.",encombrement:3,gratter:"non",couches:["surface","sous-surf
