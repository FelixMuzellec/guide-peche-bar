t mod\xE9r\xE9 (50-75) g\xE9n\xE9ralement optimal en rade",source:"peche-poissons.com (Land\xE9vennec) / Desperadiens",explain:"La rade n'a pas les courants du Cotentin. Sauf au Goulet et aux pointes (Armorique, Espagnols), les gros coefs n'apportent pas d'avantage \u2014 ils peuvent m\xEAme troubler l'eau. Sur T\xE9r\xE9nez/Land\xE9vennec, coef 40-55 explicitement recommand\xE9 par Thierry Sauvin."}]},en=[{id:"moulinmer",zone:"local",isLocal:!0,dangerLevel:1,name:"Moulin Mer",subtitle:"Pointe du Ch\xE2teau, Logonna-Daoulas",distance:"5 min",distMin:5,coords:"48\xB020'N 4\xB018'W",lat:48.3159,lon:-4.2862,type:"BORDURES GO\xC9MON",color:"#22c55e",coefBand:[25,40,80,105],coefMin:40,coefIdeal:80,coefMax:105,houleMax:1.2,exposedAngles:[315,337.5,292.5],shelteredAngles:[135,157.5,112.5],weatherNote:"Bordure nord de la presqu'\xEEle de Logonna. Prot\xE9g\xE9 des vents de S/SE par les terres ; expos\xE9 NO/N sur la rade.",sources:["Desperadiens \u2014 'P\xEAche aux leurres de surface par Relec29' (mentionne explicitement les bordures de Moulin Mer comme spot r\xE9f\xE9rence LS en go\xE9mon)","peche.com \u2014 La rade de Brest, terrain de jeu (Nicolas / brestfishing.fr)","capitaine-spots.fr \u2014 Pointe de Bindy (secteur voisin)"],topology:{fond:{text:"Bordures rocheuses avec tapis de go\xE9mons/fucus, sable-vase dans l'anse. Hauts-fonds qui s'\xE9tendent loin \xE0 BM.",confidence:"local_knowledge"},structure:{text:"Source Desperadiens/Relec29 : 'les bordures de moulin mer en Logonna Daoulas' figurent parmi les zones encombr\xE9es typiques o\xF9 le leurre souple en surface (weightless) sur go\xE9mon donne de beaux bars. Ancien moulin \xE0 mar\xE9e, petit \xE9tier, pointe rocheuse plongeante.",confidence:"verified"},exposition:{text:"Orient\xE9 NO. Bien prot\xE9g\xE9 des vents dominants O/SO par la presqu'\xEEle de Plougastel au nord ET par le relief de Logonna au sud. Vent de NE/N l\xE8ve une mer courte dans l'anse.",confidence:"local_knowledge"},courant:{text:"Courant faible \xE0 mod\xE9r\xE9, acc\xE9l\xE9ration l\xE9g\xE8re autour de la pointe. La rade de Brest a des courants globaux de 0.5 \xE0 3 nds (source navigation-croisiere), Logonna est dans la tranche basse.",confidence:"verified"},bars:{text:"Bars de bordure, souvent en petit groupe, chassent crevettes/lan\xE7ons dans le go\xE9mon. Sp\xE9cimens 40-55cm r\xE9guliers, pi\xE8ces 70+ document\xE9es dans le secteur (Relec29 sur le Relecq voisin).",confidence:"verified"}},tidalRules:{typeHeure:"MONTANT PLEIN + CR\xC9PUSCULES",montantOuDescendant:"Montant dominant pour les bordures de go\xE9mon (le flot noie les tapis et active les bars). Le descendant peut marcher c\xF4t\xE9 pointe avec courant l\xE9ger. \xC9tales peu productives sauf en p\xEAche \xE0 vue.",description:"Bordure classique : on p\xEAche le flot quand les go\xE9mons sont recouverts (bars post\xE9s dedans) et le d\xE9but de descendant quand les proies quittent les herbiers. P\xEAche \xE0 vue possible par eau claire et temps calme.",windows:[{id:"mm1",label:"2e moiti\xE9 de montant",phase:"pm",offsetBefore:-3,offsetAfter:-.5,tidePhaseType:"montant",priority:"prime",note:"Les tapis de go\xE9mons sont recouverts, bars en chasse dans les bordures. Lancer parall\xE8le \xE0 la c\xF4te, leurre souple weightless type Gambit 120mm."},{id:"mm2",label:"D\xE9but de descendant",phase:"pm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"descendant",priority:"prime",note:"Eau qui se retire des go\xE9mons, proies expos\xE9es. M\xEAme approche, possible switch stickbait/pencil surface si chasses visibles."},{id:"mm3",label:"Cr\xE9puscule BM montante",phase:"bm",offsetBefore:-.5,offsetAfter:2,tidePhaseType:"montant",priority:"prime",note:"Cumul cr\xE9puscule + d\xE9but de flot = fen\xEAtre la plus productive de la rade selon Desperadiens. Jerkbait ou stickbait sur chasses."}],lifeHack:"Approche silencieuse obligatoire \u2014 p\xEAche souvent \xE0 vue. Leurre souple weightless dans les go\xE9mons (co\xFBt faible = on les envoie o\xF9 on ne lance pas un stickbait \xE0 30\u20AC). Canne courte 2m/2.10 selon Relec29, puissance 5-15g, tresse PE0.6-0.8, fluoro 28-30/100."},lures:[{name:"Leurre souple weightless dans go\xE9mon",color:"Ayu / Motor Oil / Natural",weight:"7-10g mont\xE9 sans plomb ou t\xEAte 3-5g",technique:"Source Desperadiens directe : Gambit method shad d'Illex ou \xE9quivalent 12cm, weightless, promen\xE9 \xE0 fleur d'eau sur le go\xE9mon. L'arme absolue de Moulin Mer."},{name:"Stickbait / pencil 110-130mm",color:"Ghost / Sardine / Iwashi",weight:"14-22g",technique:"Walk-the-dog en surface au cr\xE9puscule sur montante. Asturie 110 ou Patchinko 125 en r\xE9f\xE9rence perso."},{name:"Jerkbait suspending 110mm",color:"Ayu / Mullet",weight:"12-16g",technique:"Sur les zones moins encombr\xE9es c\xF4t\xE9 pointe. Twitch lent, pauses longues."}],access:"Depuis Logonna-Daoulas bourg, direction Moulin Mer/Pointe du Ch\xE2teau. Parking devant le centre nautique. Acc\xE8s direct aux bordures rocheuses \xE0 pied. Bottes suffisent, semelles crant\xE9es utiles sur go\xE9mon humide."},{id:"bendy",zone:"local",isLocal:!0,dangerLevel:1,name:"Pointe du Bendy",subtitle:"Anse du Bendy, Logonna-Daoulas",distance:"10 min",distMin:10,coords:"48\xB019'N 4\xB019'W",type:"POINTE ROCHEUSE",color:"#4ade80",coefBand:[30,50,85,108],coefMin:50,coefIdeal:85,coefMax:108,houleMax:1.3,exposedAngles:[270,292.5,315],shelteredAngles:[90,112.5,67.5],weatherNote:"Pointe orient\xE9e \xE0 l'ouest sur la rivi\xE8re de Daoulas. Expos\xE9e aux vents d'O/NO, bien abrit\xE9e E/NE.",sources:["capitaine-spots.fr \u2014 'Pointe de Bindy/Bendy \xE0 Logonna-Daoulas : spot de p\xEAche r\xE9put\xE9 avec vue sur la rade de Brest'","tourisme-landerneau-daoulas.fr \u2014 Pointe du Bendy parmi les spots estran de Logonna (Le Roz, Le Yelen, Le Bendy, Porsisquin)","peche.com \u2014 Principes g\xE9n\xE9raux pointes rocheuses"],topology:{fond:{text:"Alternance roche-sable, platiers d\xE9couvrant sur coef > 70, herbiers de zost\xE8res en bordures. Spot d'estran riche (palourdes, bigorneaux, crevettes) donc garde-manger pour le bar.",confidence:"verified"},structure:{text:"Pointe \xE0 l'entr\xE9e de l'anse du Bendy, sur la rive sud de la rivi\xE8re de Daoulas. Configuration classique de pointe rade : l\xE9g\xE8re acc\xE9l\xE9ration du courant au tombant, tourbillon aval selon sens de mar\xE9e. Vue d\xE9gag\xE9e sur l'entr\xE9e de la rade vers l'Armorique.",confidence:"local_knowledge"},exposition:{text:"Face NO/O. Vent de NE/E arrive sur l'arri\xE8re des terres = bien abrit\xE9. Vent O/NO l\xE8ve une mer courte mais la rade reste ferm\xE9e (pas de houle oc\xE9anique).",confidence:"local_knowledge"},courant:{text:"Mod\xE9r\xE9. Courant de l'anse du Bendy + courant g\xE9n\xE9ral rade. Plus marqu\xE9 en vive-eau, quasi nul en morte-eau.",confidence:"inference"},bars:{text:"Spot explicitement qualifi\xE9 de 'p\xEAche r\xE9put\xE9e' par capitaine-spots.fr. Zone d'estran riche = nourriture abondante. Bars de passage sur le montant, post\xE9s sur le descendant derri\xE8re la pointe.",confidence:"verified"}},tidalRules:{typeHeure:"FLOT \xC9TABLI + 1h APR\xC8S PM",montantOuDescendant:"Les deux fonctionnent. Montante : bars qui remontent avec le flot, en chasse sur les platiers. Descendant : postage sur tombant aval de la pointe.",description:"Pointe de rade classique. \xC0 mi-mar\xE9e + ou -, les platiers sont accessibles et on peut lancer loin. \xC0 BM les platiers sont \xE0 d\xE9couvert, inaccessibles.",windows:[{id:"b1",label:"Fin de montant \u2192 1h apr\xE8s PM",phase:"pm",offsetBefore:-2,offsetAfter:1,tidePhaseType:"montant",priority:"prime",note:"Fen\xEAtre large : flot terminal + \xE9tale PM + tout d\xE9but de descendant. Les bars sont en chasse sur les platiers qui viennent d'\xEAtre recouverts."},{id:"b2",label:"1-2h apr\xE8s PM (descendant)",phase:"pm",offsetBefore:1,offsetAfter:2.5,tidePhaseType:"descendant",priority:"bon",note:"Postage sur le tombant aval de la pointe. Leurre coulant dans le courant descendant."},{id:"b3",label:"D\xE9but de montant (cr\xE9puscule)",phase:"bm",offsetBefore:1,offsetAfter:3,tidePhaseType:"montant",priority:"bon",note:"Si PM en fin de journ\xE9e \u2192 coup du soir optimal. Stickbait sur chasses."}],lifeHack:"Rep\xE9rer \xE0 BM les chenaux entre les platiers \u2014 ce sont les veines que les bars empruntent sur le flot. Possibilit\xE9 de p\xEAche \xE0 vue en \xE9t\xE9 par eau tr\xE8s claire et soleil bas."},lures:[{name:"Shad souple 10-14cm t\xEAte plomb\xE9e",color:"Natural / Smoke / Chartreuse",weight:"10-18g",technique:"Prospection large sur platiers recouverts. R\xE9cup\xE9 lente avec pauses."},{name:"Stickbait / pencil bait",color:"Ghost / Sardine",weight:"18-28g",technique:"Walk-the-dog au-dessus des platiers en fin de montant si mer calme."},{name:"Jerkbait suspending",color:"Ayu / Mullet",weight:"12-16g",technique:"Twitchs courts entre les blocs rocheux c\xF4t\xE9 pointe."}],access:"Depuis Logonna-Daoulas bourg, route vers Pointe du Bendy (fl\xE9ch\xE9). Parking au bout de la route. Acc\xE8s \xE0 pied par sentier c\xF4tier (GR34). P\xEAche depuis les rochers de la pointe ou sur les platiers selon mar\xE9e."},{id:"rostiviec",zone:"local",isLocal:!0,dangerLevel:1,name:"Rostiviec",subtitle:"Port et anse de Penfoul, Loperhet",distance:"15 min",distMin:15,coords:"48\xB020'N 4\xB018'W",type:"RIA / BAIE DE DAOULAS",color:"#34d399",coefBand:[20,35,75,100],coefMin:35,coefIdeal:75,coefMax:100,houleMax:1.2,exposedAngles:[202.5,180,225],shelteredAngles:[0,22.5,337.5],weatherNote:"Port nich\xE9 dans une ria : brise maritime pr\xE9sente mais abri quasi permanent de la houle. Le clapot ne s'y forme que par vent de sud \xE9tabli.",sources:["pays-landerneau-daoulas.fr \u2014 Le centre nautique est situ\xE9 sur le littoral de la commune de Loperhet, au port de Rostiviec, nich\xE9 dans une ria de la rade de Brest ; zone de navigation sur la baie de Daoulas (12 km\xB2), abrit\xE9e de la houle","tourisme-landerneau-daoulas.fr \u2014 Loperhet list\xE9 avec ses propres sites (Pors Don, Kersanton), distincts de ceux de L'H\xF4pital-Camfrout","despoissonssigrands.com \u2014 P\xEAche du bar en fond de rade (principes)"],topology:{fond:{text:"Vase et sablo-vase dominants dans l'anse, cailloutis sur les bordures. Parcs et anciennes zones ostr\xE9icoles en pourtour de la baie de Daoulas.",confidence:"inference"},structure:{text:"Ancien village de p\xEAcheurs et port de plaisance install\xE9 dans une ria, sur la baie de Daoulas. L'anse de Penfoul prolonge le site vers l'est. Chenal d'acc\xE8s et zone de mouillages structurent les fonds.",confidence:"verified"},exposition:{text:"Abri remarquable : la ria coupe la houle de rade quelle que soit sa direction. Le site reste ventil\xE9 par la brise thermique, mais la mer y est form\xE9e seulement par vent de S/SO \xE9tabli remontant la baie.",confidence:"verified"},courant:{text:"Courant mod\xE9r\xE9, canalis\xE9 par le chenal d'acc\xE8s et les bordures de mouillages. Nettement plus faible que sur les pointes de la rade \u2014 c'est un poste de finesse, pas de force.",confidence:"inference"},bars:{text:"Bars de bordure patrouillant les mouillages, les coques de bateaux et les bordures vaseuses au flot. Poste de repli par excellence quand tout le reste de la rade est imp\xEAchable.",confidence:"inference"}},tidalRules:{typeHeure:"MONTANT SUR LES BORDURES",montantOuDescendant:"Montant dominant : le flot recouvre les vasi\xE8res et les bars entrent y chasser crevettes et gobies. Le descendant concentre le poisson dans le chenal.",description:"Spot d'abri et de finesse. On y va quand le vent interdit les pointes, et on y p\xEAche l\xE9ger, en p\xEAche \xE0 vue si l'eau est claire.",windows:[{id:"ro1",label:"3 premi\xE8res heures de montant",phase:"bm",offsetBefore:.5,offsetAfter:3,tidePhaseType:"montant",priority:"prime",note:"Le flot recouvre les vasi\xE8res. Longer les bordures et les lignes de mouillages, souple l\xE9ger ou weightless."},{id:"ro2",label:"Fin de montant sur les mouillages",phase:"pm",offsetBefore:-2,offsetAfter:-.5,tidePhaseType:"montant",priority:"bon",note:"Les bars circulent entre les coques. Approche silencieuse, leurre discret."},{id:"ro3",label:"D\xE9but de descendant (chenal)",phase:"pm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"descendant",priority:"bon",note:"L'eau se retire des vasi\xE8res et concentre le poisson dans le chenal. Shad plomb\xE9 l\xE9ger dans la veine."}],lifeHack:"C'est le spot de mauvais temps de la rade : quand l'ouest souffle \xE0 5 Beaufort et que tout est blanc dehors, ici c'est plat. P\xEAcher fin, fluorocarbone 25/100, leurres discrets \u2014 l'eau y est souvent tr\xE8s claire."},lures:[{name:"Souple weightless ou t\xEAte plomb\xE9e l\xE9g\xE8re",color:"Natural / Smoke / Motor Oil",weight:"5-10 g",technique:"Bordures vaseuses et lignes de mouillages. Le poids minimal qui permet encore de lancer."},{name:"Jerkbait suspending 100-110 mm",color:"Ayu / Mullet / Crystal",weight:"12-16 g",technique:"Twitch lent dans les zones d\xE9gag\xE9es du chenal."},{name:"Shad souple 10-12 cm en texan",color:"Natural / blanc",weight:"10-16 g",technique:"Texan indispensable pr\xE8s des parcs et des corps-morts."}],access:"Depuis Logonna : Daoulas puis Loperhet, direction port de Rostiviec. Parking \xE0 la cale, sentier c\xF4tier vers l'anse de Penfoul. Aucune difficult\xE9."},{id:"camfrout",zone:"local",isLocal:!0,dangerLevel:2,name:"L'H\xF4pital-Camfrout",subtitle:"Rivi\xE8re du Camfrout, Tibidy, Troaon",distance:"15 min",distMin:15,coords:"48\xB017'N 4\xB014'W",type:"ESTUAIRE / TOMBOLO",color:"#34d399",coefBand:[25,45,85,108],coefMin:45,coefIdeal:85,coefMax:108,houleMax:1.3,exposedAngles:[292.5,315,270],shelteredAngles:[112.5,135,90],weatherNote:"Estuaire encastr\xE9 en fond de rade, abrit\xE9 des vents d'O/SO par la g\xE9ographie. Le vent de NO remonte la ria.",sources:["en.wikipedia.org/wiki/\xCEle_de_Tibidy \u2014 Tibidy est un \xEElot \xE0 l'embouchure de la rivi\xE8re du Faou, en fond de rade de Brest, sur des terres appartenant \xE0 la commune de L'H\xF4pital-Camfrout, reli\xE9 au continent par un cordon littoral","tourisme-landerneau-daoulas.fr \u2014 Sites de L'H\xF4pital-Camfrout : Tibidy, Kerdreolet, Troaon, Kerhasco\xEBt (list\xE9s distinctement de ceux de Loperhet)","tourisme-landerneau-daoulas.fr \u2014 Kerhasco\xEBt, ancien port coquillier de la commune, vue sur la presqu'\xEEle de Logonna","despoissonssigrands.com \u2014 P\xEAche du bar en estuaire (principes)"],topology:{fond:{text:"Vase-sable dans l'estuaire du Camfrout, cailloux et roche vers Tibidy. Parcs \xE0 hu\xEEtres sur les bordures, herbiers de zost\xE8res document\xE9s en fond de rade \u2014 indicateur de richesse biotique.",confidence:"inference"},structure:{text:"Deux structures superpos\xE9es : l'estuaire de la rivi\xE8re du Camfrout, et l'\xEElot de Tibidy reli\xE9 au continent par un cordon littoral, \xE0 l'embouchure de la rivi\xE8re du Faou. Le cordon est une barri\xE8re physique qui d\xE9vie le flux et cr\xE9e un poste d'embuscade franc.",confidence:"verified"},exposition:{text:"Double abri : repli\xE9 au fond de la ria, et Tibidy masque la sortie. Quasi inattaquable par vent d'O/SO. Le NO remonte l'estuaire et rend l'eau moins lisible.",confidence:"inference"},courant:{text:"Chenalisation nette. Courant mod\xE9r\xE9 dans l'estuaire, sensiblement plus marqu\xE9 autour du cordon de Tibidy o\xF9 le flux est resserr\xE9.",confidence:"inference"},bars:{text:"Biotope euryhalin classique du bar en fond de rade : gradient de salinit\xE9, proies concentr\xE9es, bars r\xE9sidents doubl\xE9s de poissons de passage sur le montant.",confidence:"inference"}},tidalRules:{typeHeure:"3 PREMI\xC8RES HEURES DE MONTANT (r\xE8gle estuaire)",montantOuDescendant:"Montant dominant \u2014 les bars entrent avec le flot pour chasser dans le chenal et autour des parcs. Fin de descendant exploitable en postage \xE0 la sortie.",description:"R\xE8gle classique d'estuaire : trois premi\xE8res heures de montant depuis BM+0h30. Les gros bars remontent avec la mar\xE9e puis redescendent avec le jusant.",windows:[{id:"hc1",label:"3 premi\xE8res heures de montant",phase:"bm",offsetBefore:.5,offsetAfter:3,tidePhaseType:"montant",priority:"prime",note:"R\xE8gle la plus universelle en estuaire. Se poster sur les bordures du chenal ou le long du cordon de Tibidy."},{id:"hc2",label:"Fin de descendant (sortie d'estuaire)",phase:"bm",offsetBefore:-2,offsetAfter:-.5,tidePhaseType:"descendant",priority:"bon",note:"Les bars quittent l'estuaire par le resserrement de Tibidy : embuscade en sortie."},{id:"hc3",label:"D\xE9but de descendant (postage chenal)",phase:"pm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"descendant",priority:"bon",note:"Shad plomb\xE9 dans les veines profondes du chenal."}],lifeHack:"Rep\xE9rer les postes \xE0 basse mer : fosses du chenal, bordures herbeuses, parcs \xE0 hu\xEEtres. Fluorocarbone fin (25/100) car l'eau est claire. Texan indispensable pour ne pas s'accrocher dans les parcs. Le cordon de Tibidy se traverse \xE0 pied \xE0 basse mer en vive-eau \u2014 v\xE9rifier l'heure de retour avant de s'engager."},lures:[{name:"Shad souple 10-12 cm en texan",color:"Natural / Smoke / Motor Oil",weight:"10-16 g",technique:"R\xE9f\xE9rence estuaire. Texan anti-accrochage essentiel sur les parcs et les herbiers."},{name:"Jerkbait suspending 100-110 mm",color:"Ayu / Mullet / Crystal",weight:"12-16 g",technique:"Twitch lent dans les zones d\xE9gag\xE9es du chenal."},{name:"Pintail / slug weightless",color:"White UV / Natural",weight:"5-10 g sans plomb",technique:"P\xEAche \xE0 vue dans les bordures peu profondes si eau claire et soleil."}],access:"Depuis Logonna : D770 vers L'H\xF4pital-Camfrout. Parkings du bourg et de Kerhasco\xEBt. Acc\xE8s \xE0 Troaon, Kerdreolet et au cordon de Tibidy. Bottes ou waders selon le poste."},{id:"lauberlach",zone:"local",isLocal:!0,dangerLevel:1,name:"Sillon de Lauberlac'h",subtitle:"Anse de l'Auberlach, Plougastel-Daoulas",distance:"25 min",distMin:25,coords:"48\xB021'N 4\xB021'W",type:"SILLON / ANSE",color:"#86efac",coefBand:[30,50,88,110],coefMin:50,coefIdeal:88,coefMax:110,houleMax:1.5,exposedAngles:[202.5,180,225],shelteredAngles:[315,337.5,292.5],weatherNote:"Source lordjimcroisieres : 'Anse de l'Auberlach ouverte au Sud-Ouest et bien prot\xE9g\xE9e des vents de Nord-Ouest jusqu'au sud-est.'",sources:["lordjimcroisieres.com \u2014 Navigation rade de Brest : Anse de l'Auberlach, exposition SO et protection NO\u2192SE","campingsaintjean.com \u2014 Porz Gwenn et Sillon de Lauberlac'h parmi les sites de p\xEAche \xE0 pied/au leurre privil\xE9gi\xE9s","peche.com \u2014 P\xEAche en rade de Brest (Nicolas/brestfishing)"],topology:{fond:{text:"Sillon = fl\xE8che de galets qui ferme partiellement l'anse. Sable-vase \xE0 l'int\xE9rieur, roche et platiers en bordure. Zone riche en coques/palourdes/couteaux (source camping Saint-Jean) = biotope pour le bar.",confidence:"verified"},structure:{text:"Classique 'sillon' breton : cordon littoral parall\xE8le \xE0 la c\xF4te qui cr\xE9e une anse int\xE9rieure prot\xE9g\xE9e. Les bars patrouillent le long du sillon c\xF4t\xE9 rade, et entrent dans l'anse sur le flot. Cale et mouillages dans l'anse.",confidence:"verified"},exposition:{text:"Source directe lordjimcroisieres : ouverte au SO, prot\xE9g\xE9e NO\u2192SE. Spot parfait par vent du secteur N \xE0 E. \xC0 \xE9viter par fort vent SO.",confidence:"verified"},courant:{text:"Courant mod\xE9r\xE9 sur le sillon ext\xE9rieur, tr\xE8s faible dans l'anse. Bascule de courant selon la mar\xE9e qui entre/sort de l'anse.",confidence:"inference"},bars:{text:"Plougastel figure 'parmi les sites les plus privil\xE9gi\xE9s pour la p\xEAche depuis le bord' (camping Saint-Jean). Bars qui longent le sillon c\xF4t\xE9 rade, patrouillent en bordure d'anse sur le montant.",confidence:"verified"}},tidalRules:{typeHeure:"LE LONG DU SILLON SUR MONTANT + ANSE SUR FLOT PLEIN",montantOuDescendant:"Montant dominant : longer le sillon c\xF4t\xE9 ext\xE9rieur (rade) pour chercher les bars de passage, puis passer dans l'anse quand le flot y entre.",description:"Deux approches selon l'heure de mar\xE9e : (1) c\xF4t\xE9 rade du sillon = prospection longue distance sur montant ; (2) \xE0 l'int\xE9rieur de l'anse = p\xEAche fine en bordure quand le flot a rempli.",windows:[{id:"la1",label:"Montant plein (flot \xE9tabli)",phase:"bm",offsetBefore:1.5,offsetAfter:4.5,tidePhaseType:"montant",priority:"prime",note:"Longer le sillon c\xF4t\xE9 rade, lancer parall\xE8le \xE0 la c\xF4te. Les bars remontent le long du cordon."},{id:"la2",label:"\xC9tale PM + d\xE9but descendant (dans l'anse)",phase:"pm",offsetBefore:-.5,offsetAfter:1.5,tidePhaseType:"renversement",priority:"prime",note:"Anse pleine, eau calme, bars en chasse fine sur les bordures. P\xEAche \xE0 vue ou LS weightless."},{id:"la3",label:"Cr\xE9puscule",phase:"pm",offsetBefore:-1,offsetAfter:2,tidePhaseType:"variable",priority:"bon",note:"Coup du soir universellement favorable, \xE0 cumuler avec une des deux fen\xEAtres ci-dessus."}],lifeHack:"Le sillon est long (~500m selon Land\xE9vennec/Sauvin, transposable ici). Rep\xE9rer \xE0 BM les veines et les go\xE9mons. Le changement de c\xF4t\xE9 (ext\xE9rieur sillon \u2192 int\xE9rieur anse) suit la mar\xE9e. Refuge par vent de secteur N quand les autres spots locaux sont moins confortables."},lures:[{name:"Shad 10-14cm t\xEAte plomb\xE9e",color:"Natural / Smoke / Ayu",weight:"10-18g",technique:"Prospection longue le long du sillon c\xF4t\xE9 rade."},{name:"Stickbait 110-130mm",color:"Ghost / Sardine",weight:"18-28g",technique:"Surface au-dessus du sillon et en entr\xE9e d'anse sur montante."},{name:"LS weightless (pintail, slug)",color:"White / Natural / UV",weight:"5-10g sans plomb",technique:"P\xEAche fine dans l'anse \xE0 eau calme, \xE0 vue si possible. Approche silencieuse."}],access:"D770 puis direction Lauberlac'h / Plougastel-Daoulas sud. Parking \xE0 la cale de l'anse. Sentier c\xF4tier (GR34) longe le sillon \u2014 acc\xE8s direct aux deux c\xF4t\xE9s. Pas de difficult\xE9 technique."},{id:"armorique",zone:"inter",isLocal:!1,dangerLevel:1,name:"Pointe de l'Armorique",subtitle:"Plougastel-Daoulas nord",distance:"30 min",distMin:30,coords:"48\xB021'N 4\xB025'W",type:"POINTE RADE",color:"#14b8a6",coefBand:[35,55,90,112],coefMin:55,coefIdeal:90,coefMax:112,houleMax:1.5,exposedAngles:[270,292.5,247.5],shelteredAngles:[90,112.5,67.5],weatherNote:"Pointe qui avance dans la rade, c\xF4t\xE9 nord de Plougastel. Source lordjimcroisieres : 'le courant est bien sensible \xE0 la pointe de l'Armorique' \u2014 un des points de courant notable de la rade.",sources:["lordjimcroisieres.com \u2014 Pointe de l'Armorique cit\xE9e comme point de courant sensible (0.5-3 nds) en rade","peche.com \u2014 P\xEAche rade de Brest (sparid\xE9s en bordure des tombants de sortie de rade vers goulet)","peche.com \u2014 Principes pointes rocheuses / tourbillons"],topology:{fond:{text:"Tombant plus marqu\xE9 qu'en fond de rade. Roche et platiers. Source peche.com : les tombants de sortie de rade en direction du goulet concentrent les sparid\xE9s (et donc le bar qui les suit).",confidence:"verified"},structure:{text:"Pointe majeure de la rade, sur la trajectoire des poissons qui entrent/sortent entre fond de rade et goulet. Tourbillon classique en aval de la pointe selon sens du courant (principe peche.com document\xE9 sur toute pointe).",confidence:"verified"},exposition:{text:"Orient\xE9e NO. Vent d'E/NE = bien abrit\xE9. Vent O/NO/SO = exposition frontale, la rade peut se lever avec du clapot.",confidence:"inference"},courant:{text:"Source directe lordjimcroisieres : 0.5-3 nds selon mar\xE9e et coef. Un des 4 points de courant sensible de la rade (avec Espagnols, pont Plougastel, sortie Aulne).",confidence:"verified"},bars:{text:"Pointe sur zone de passage = poste classique pour bars de passage entre rade et goulet. Gros bars possibles en fin de saison quand les poissons redescendent vers le goulet.",confidence:"inference"}},tidalRules:{typeHeure:"DESCENDANT (tourbillon aval) + D\xC9BUT MONTANT",montantOuDescendant:"Pointe = les deux marchent, mais le descendant expose mieux les tombants. Principe peche.com pointes rocheuses : lancer en amont du courant, d\xE9rive en aval.",description:"Pointe de rade avec courant notable. Changer de c\xF4t\xE9 selon sens du courant : c\xF4t\xE9 NE sur descendant (courant qui s'\xE9chappe vers le goulet), c\xF4t\xE9 SO sur montant.",windows:[{id:"ar1",label:"1-2h apr\xE8s PM (descendant)",phase:"pm",offsetBefore:1,offsetAfter:2.5,tidePhaseType:"descendant",priority:"prime",note:"Courant \xE9tabli vers le goulet. Leurre coulant en amont, d\xE9rive en aval de la pointe."},{id:"ar2",label:"3 derni\xE8res heures avant BM",phase:"bm",offsetBefore:-3,offsetAfter:-.5,tidePhaseType:"descendant",priority:"prime",note:"Reprise du courant descendant. Fen\xEAtre classique pointes rocheuses."},{id:"ar3",label:"D\xE9but de montant (c\xF4t\xE9 SO)",phase:"bm",offsetBefore:.5,offsetAfter:2.5,tidePhaseType:"montant",priority:"bon",note:"Bascule de c\xF4t\xE9. Le flot remonte vers le fond de rade, bars de passage."}],lifeHack:"Sur cette pointe le courant peut atteindre 3 nds : utiliser des leurres plus lourds qu'ailleurs en rade (25-40g). Rep\xE9rer les tourbillons visuellement (surface) avant de placer le leurre."},lures:[{name:"Sinking pencil / Asturie 110-130",color:"Ayu / Ghost / Bar naturel",weight:"25-40g",technique:"Principe pointes rocheuses : lancer contre courant, d\xE9rive lente en aval."},{name:"Shad 5\u2033 t\xEAte plomb\xE9e lourde",color:"White / Natural / Chartreuse",weight:"18-28g",technique:"Prospection du tombant sur courant \xE9tabli."},{name:"Stickbait 125-140mm",color:"Sardine / Ghost",weight:"25-35g",technique:"Walk-the-dog en surface au cr\xE9puscule si pas trop de courant. Patchinko 125 ou 140 adapt\xE9."}],access:"Depuis Logonna : D770 puis direction Plougastel-Daoulas nord, route de la Pointe de l
