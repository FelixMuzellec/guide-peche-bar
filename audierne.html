e (les deux ports sont \xE0 \xB12,5 \xE0 \xB14,5 min)"}}},sstTypical:[10,17]},mh={title:"Principes de la p\xEAche du bar du bord au Cap Sizun et en baie d'Audierne",items:[{rule:"\xC0 la pointe du Raz : sur place une heure avant la pleine mer, p\xEAcher deux \xE0 trois heures",source:"peche-poissons.com \u2014 julien, \xAB Au leurre, \xE0 la pointe du Raz \xBB (17/12/2021), conseils du guide Yves Pennanen",explain:"\xAB Le d\xE9but de la montante est souvent excellent. \xBB Bars et lieus se tiennent dans les zones de courant. Le poste est un promontoire \xE0 une trentaine de m\xE8tres au-dessus de l'eau : canne de 2,40 \xE0 2,70 m, assez puissante pour remonter le poisson ; rochers couverts d'algues et de lichen glissants."},{rule:"Raz de Sein : renverse peu avant les pleines et basses mers de Brest, 6 n\u0153uds en vive-eau",source:"bateaux.com \u2014 C. Fernbach, \xAB Le Raz de Sein, les bons conseils pour ce passage d\xE9licat \xBB (08/07/2025) \xB7 lordjimcroisieres.com",explain:"Le courant s'inverse 20 minutes avant la basse mer de Brest et 45 minutes avant la pleine mer (bateaux.com) ; \xAB environ 1 h avant la PM de Brest \xBB selon une autre source. L'\xE9tale dure une trentaine de minutes. En vive-eau, 6 n\u0153uds, et une \xAB mer d\xE9mont\xE9e d\xE8s qu'il s'opposera au vent m\xEAme mod\xE9r\xE9 \xBB."},{rule:"Une saison qui d\xE9marre tard sur le cap",source:"P\xEAche-Rando Bar (guide de p\xEAche du bar au cap Sizun) \u2014 bilans 2016 et 2018",explain:"L'eau du cap d\xE9passe rarement 15 \xB0C en d\xE9but de saison ; en 2018, l'eau froide \xAB jusqu'\xE0 d\xE9but juin \xBB a retard\xE9 l'arriv\xE9e des poissons. Les fonds de baie peu profonds, plus chauds, se r\xE9veillent les premiers."},{rule:"Eau claire et calme : descendre en diam\xE8tre ; le matin t\xF4t",source:"P\xEAche-Rando Bar \u2014 \xAB Petit bilan 2018 \xBB (06/03/2019)",explain:"Par eau claire et mer calme, le guide descend en diam\xE8tre de bas de ligne ; ses meilleurs poissons sont venus t\xF4t le matin. En octobre, par forte houle, les leurres de surface ne sont \xAB quasiment pas utilisables \xBB."},{rule:"Grosse houle : leurre lourd, et un 93 cm au fond d'une crique",source:"P\xEAche-Rando Bar \u2014 \xAB Une petite s\xE9lection de leurres pour p\xEAcher du bord \xBB (24/02/2020) et bilan 2017",explain:`S\xE9lection du guide : Sand Eel sur t\xEAte de 21 g, Gambler 5" sur t\xEAte de 7 g, Nitro Shad 90 sur t\xEAte de 15 g, Dolive Shad 4,5" sans plomb ; Chihuahua 110 par mer form\xE9e ; jig dans le gros ressac. Un bar de 93 cm pris \xAB en tr\xE8s forte houle dans un fond de crique rocheuse \xBB. Waders sur les plages des baies d'Audierne et de Douarnenez.`},{rule:"Estuaires et plages du Finist\xE8re sud",source:"peche-poissons.com \u2014 J.-B. Vidal, \xAB Bar en Bretagne\u2026 o\xF9, quand, comment ? \xBB (19/10/2026)",explain:"Estuaires (dont le Goyen) : \xAB tr\xE8s pris\xE9s par les p\xEAcheurs de bars notamment \xE0 vue \xBB, imitations de crabe \xAB tr\xE8s efficaces sur les bars d'estuaire \xBB. R\xE8gle g\xE9n\xE9rale de la source pour le bar (pas propre aux estuaires) : souvent les trois premi\xE8res heures de montante et les trois derni\xE8res de descendante, coefficients de 50 \xE0 80, les phases \xAB vont d\xE9pendre de chaque coin \xBB. \xAB Dans le Finist\xE8re Sud toutes les plages tiennent du poisson \xBB ; sur chaque plage, le bon moment s'apprend sur plusieurs sorties."}]},pS={slackH:-.35,labels:{1:"plein courant du raz (vers la mi-mar\xE9e)",2:"courant du raz qui forcit ou faiblit",0:"pr\xE8s de la renverse du raz (vers la pleine ou la basse mer)"},why:"Dans le Raz de Sein, le courant s'inverse peu avant les pleines et basses mers de Brest (20 min avant la basse mer, 45 min avant la pleine mer) ; il est donc maximal vers la mi-mar\xE9e, jusqu'\xE0 6 n\u0153uds en vive-eau.",src:"razSein",deduit:"Renverse retenue 20 min avant la pleine et la basse mer d'Audierne (qui pr\xE9c\xE8de Brest d'environ 22 min). Deux autres sources dise M\xE9thode, photo par photo :
1. Dis ce que montre la photo (angle de vue, distance, partie du site) et sa qualit\xE9.
2. Balaie l'image dans l'ordre : premier plan, plan moyen, arri\xE8re-plan ; de gauche \xE0 droite.
3. Rel\xE8ve ce qui est visible parmi : l'\xE9tat de la surface (lisse, rid\xE9e, clapot, vagues, d\xE9ferlement, \xE9cume, lignes ou veines, remous, plaques lisses dans une zone rid\xE9e) ; la couleur et la transparence de l'eau et leurs contrastes ; la roche (platier, blocs, failles, tombant, galets) ; le sable ou la vase ; la v\xE9g\xE9tation (algues, go\xE9mon, herbier) ; l'estran d\xE9couvert ; les ouvrages (cale, digue, \xE9pi, bouchots, tables \xE0 hu\xEEtres, corps-morts, bou\xE9es) ; les acc\xE8s et les dangers visibles ; la vie visible (oiseaux qui plongent ou tournent, \xE9claboussures, poissons) ; le ciel et la lumi\xE8re.

R\xE8gles strictes :
- Une observation = un seul fait visible, situ\xE9 : num\xE9ro de photo et zone de l'image (\xAB premier plan gauche \xBB, \xAB centre, plan moyen \xBB\u2026), plus x et y, la position approximative de son centre en pourcentage de la photo (x : 0 au bord gauche, 100 au bord droit ; y : 0 en haut, 100 en bas).
- Aucun mot d'interpr\xE9tation de p\xEAche (poste, bar, chasse probable, bon coin\u2026) : seulement ce qui se voit.
- Aucune mesure invent\xE9e : pas de profondeur, de vitesse de courant, de hauteur ni de distance chiffr\xE9es. Les comparaisons sont permises (\xAB plus fonc\xE9 que \xBB, \xAB plus large que \xBB).
- Si un \xE9l\xE9ment est ambigu, dis-le et mets la confiance \xE0 \xAB faible \xBB ; ne le compl\xE8te jamais avec ce qui serait probable.
- Ne nomme pas le lieu, sauf s'il est \xE9crit sur la photo.
- Ignore les personnes : ne les d\xE9cris pas et ne cherche pas \xE0 les identifier.
- Dans \xAB non_visible \xBB, liste ce que ces photos ne permettent pas de savoir et qui compterait pour un p\xEAcheur (profondeur, nature du fond sous l'eau, courant hors de la surface visible, ce qui est hors cadre\u2026).
- R\xE9ponds en fran\xE7ais.`,k4=`Tu es un contr\xF4leur exigeant. On te donne des photos et une liste d'observations faites par quelqu'un d'autre.
Pour chaque observation, regarde la photo et la zone indiqu\xE9es, et d\xE9cide :
- \xAB confirme \xBB : le fait est nettement visible \xE0 cet endroit ;
- \xAB douteux \xBB : c'est possible mais ambigu, flou, ou visible ailleurs que dans la zone et la position indiqu\xE9es ;
- \xAB absent \xBB : tu ne le vois pas, ou la photo le contredit.
Sois strict : entre \xAB confirme \xBB et \xAB douteux \xBB, choisis \xAB douteux \xBB. Une mesure chiffr\xE9e ou une interpr\xE9tation pr\xE9sent\xE9e comme un fait visible est \xAB absent \xBB.
Juge seulement ce qui est visible ; n'ajoute aucune observation. Donne pour chaque verdict une raison courte, en fran\xE7ais. Rends exactement un verdict par identifiant re\xE7u.`,M4=`Tu es un p\xEAcheur professionnel du bar au leurre, du bord, sur les c\xF4tes de Bretagne et de Normandie. Tu lis un spot \xE0 partir de FAITS num\xE9rot\xE9s, et de rien d'autre :
- o\u2026 : observations des photos, v\xE9rifi\xE9es (\xAB incertain \xBB quand la v\xE9rification les a jug\xE9es douteuses) ;
- t\u2026 : mar\xE9e et lumi\xE8re au moment des photos, calcul\xE9es par l'application ;
- f\u2026 : fiche du spot dans le guide ;
- u\u2026 : ce que dit le p\xEAcheur.

M\xE9thode : 1. lecture de l'eau et du courant ; 2. structures et fond ; 3. o\xF9 le bar a des raisons de se tenir, et pourquoi (postes) ; 4. moment de mar\xE9e et de lumi\xE8re, seulement si des faits t ou f le permettent ; 5. approche et placement du p\xEAcheur ; 6. s\xE9curit\xE9 ; 7. risque d'accroche ; 8. familles de leurres adapt\xE9es aux couches d'eau et au fond ; 9. confrontation avec la fiche (seulement si des faits f existent) ; 10. ce qu'il faut v\xE9rifier sur place.

R\xE8gles strictes :
- Chaque \xE9l\xE9ment cite dans \xAB refs \xBB les identifiants exacts des faits qui le fondent. Un \xE9l\xE9ment qu'aucun fait ne fonde ne doit pas \xEAtre \xE9crit.

- N'invente rien : aucune profondeur, vitesse, distance, proie, nom de lieu ou source qui ne figure pas dans les faits.
- Une observation \xAB incertaine \xBB ne fonde jamais seule un poste ou une consigne.
- Si les faits ne suffisent pas, dis-le (accroche \xAB indetermine \xBB, moment \xAB non d\xE9terminable avec ces photos \xBB) plut\xF4t que de combler.
- Leurres : seulement les familles surface, nageur (poisson nageur), weightless (souple non plomb\xE9 ou texan), shad (souple plomb\xE9), metal ; aucune marque ni mod\xE8le.
