# Chaque matin, vérifie contre le vrai service Open-Meteo que les modèles
# (AROME, ECMWF), les variables et les formats utilisés par les deux guides
# existent toujours. En cas d'échec, GitHub envoie un e-mail : on le sait le
# jour même, pas sur le spot.
name: Contrat Open-Meteo

on:
  schedule:
    - cron: "17 4 * * *"   # 04 h 17 UTC, tous les jours
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read

jobs:
  contrat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Contrat Open-Meteo (réseau réel)
        run: npm run -s test:contract
